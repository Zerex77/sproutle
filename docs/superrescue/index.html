<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1440">
<meta name="description" content="Super Rescue: a free superhero tapping game for little kids. Pick a hero, catch the bad guys and save the people in the city. Big buttons, no timer, no way to lose.">
<link rel="canonical" href="https://playsproutle.com/superrescue/">
<meta property="og:title" content="Super Rescue">
<meta property="og:description" content="Pick a hero, catch the bad guys and save the people. A superhero tapping game for little kids.">
<meta property="og:url" content="https://playsproutle.com/superrescue/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://playsproutle.com/superrescue/icon-512.png">
<link rel="icon" type="image/png" href="/superrescue/icon-192.png">
<link rel="apple-touch-icon" href="/superrescue/apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Super Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap">
<style>
/* Comic-book night city: one dark look, bold ink outlines, yellow POW accent. Full-screen one-screen app. */
:root{
  --night:#1b1440; --sky:#2c2166; --bldg:#3b2f7a; --bldg2:#4a3c95; --ink:#141018;
  --pow:#ffd23f; --glow:#ffe9a3; --paper:#fff7e0; --bad:#8e5bd6; --love:#ff5d8f; --dim:#5a4ca8;
  --display:"Luckiest Guy","Arial Black",Impact,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;max-width:560px;margin:0 auto}
header{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:6px}
.home{position:absolute;right:0;top:0;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--paper);color:var(--ink);border:3px solid var(--ink)}
.home:focus-visible{outline:4px solid var(--pow);outline-offset:2px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,40px);margin:0;letter-spacing:1px;color:var(--pow);
  -webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);line-height:1}
.stars{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.stars svg{width:26px;height:26px}
.stars svg.on{animation:pop .4s}
.stars svg path{fill:var(--dim);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.stars svg.on path{fill:var(--pow)}

.scene{position:relative;flex:1;min-height:0;border:4px solid var(--ink);border-radius:18px;overflow:hidden;
  background:radial-gradient(circle at 82% 14%, rgba(255,233,163,.35) 0 9%, transparent 22%),
             radial-gradient(rgba(255,255,255,.08) 1.5px, transparent 1.6px) 0 0/14px 14px,
             linear-gradient(var(--sky),var(--night));}
.moon{position:absolute;right:10%;top:7%;width:44px;height:44px;border-radius:50%;background:var(--glow);border:3px solid var(--ink)}
.city{position:absolute;inset:auto 0 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;padding:0 8px;height:86%}
.bldg{background:var(--bldg);border:4px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;
  display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:14px 10px 18px;position:relative}
.bldg:nth-child(2){background:var(--bldg2);padding-top:30px}
.bldg::before{content:"";position:absolute;top:-16px;left:50%;width:6px;height:14px;background:var(--ink);transform:translateX(-50%)}
.win{position:relative;aspect-ratio:1;width:100%;max-width:100%;max-height:22vh;margin:0 auto;border:4px solid var(--ink);border-radius:10px;
  background:#2a2160;padding:0;cursor:pointer;display:grid;place-items:center;transition:background .2s}
.win.full{background:var(--glow)}
.win:focus-visible{outline:4px solid var(--pow);outline-offset:2px}
.occ{width:88%;height:88%;animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
.occ svg{width:100%;height:100%;overflow:visible}
.bad .occ{animation:popin .35s cubic-bezier(.3,1.6,.5,1),wobble 1.2s .35s ease-in-out infinite}
.help{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);font-family:var(--display);
  font-size:13px;padding:2px 7px 0;border:3px solid var(--ink);border-radius:10px;white-space:nowrap;animation:bob .8s ease-in-out infinite alternate;z-index:2}
.arm{transform-origin:50% 100%;animation:wave .5s ease-in-out infinite alternate}
.burst{position:absolute;inset:-18px;display:grid;place-items:center;z-index:5;pointer-events:none;animation:burst .6s ease-out forwards}
.burst svg{position:absolute;inset:0;width:100%;height:100%}
.burst b{position:relative;font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);transform:rotate(-8deg)}

#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;overflow:visible}
.puff{transform-box:fill-box;transform-origin:center;animation:puff .55s ease-out forwards}
.bolt{animation:flash .5s ease-out forwards}
.occ.zapped{filter:sepia(1) hue-rotate(165deg) saturate(4) brightness(1.15);animation:shake .07s 6!important}
.goo{position:absolute;inset:2%;z-index:3;animation:popin .25s cubic-bezier(.3,1.6,.5,1)}
.goo svg{width:100%;height:100%}
.bub{position:absolute;inset:-2%;border-radius:50%;z-index:3;border:4px solid var(--ink);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 9%,transparent 10%),radial-gradient(circle,rgba(255,111,207,.15) 50%,rgba(255,111,207,.6));
  animation:popin .3s cubic-bezier(.3,1.6,.5,1)}
.float{transition:transform .8s ease-in,opacity .8s ease-in!important;transform:translateY(-260px) scale(.7)!important;opacity:0}
#hero.fast{transition-duration:.2s}
#hero.cast svg{animation:pop .35s}
.pw{font-size:10px;color:var(--dim);font-weight:900;text-transform:uppercase;letter-spacing:.03em}
@keyframes puff{from{transform:scale(1);opacity:1}to{transform:scale(2.2);opacity:0}}
@keyframes flash{0%,55%{opacity:1}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
#hero{position:absolute;left:0;top:0;width:76px;height:84px;z-index:10;pointer-events:none;
  transition:transform .38s cubic-bezier(.5,0,.3,1);filter:drop-shadow(3px 4px 0 rgba(0,0,0,.35))}
#hero svg{width:100%;height:100%;overflow:visible}
#hero.idle svg{animation:hover 1.4s ease-in-out infinite alternate}

footer{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:8px}
.tally{display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:4px 10px}
.tally svg{width:38px;height:38px;flex:none}
.tally span{font-family:var(--display);font-size:28px;line-height:1;padding-top:4px}
.tally small{font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.06em;line-height:1.1}
.tally.bump{animation:pop .35s}

.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(20,16,24,.78);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);color:var(--ink);border:5px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);
  padding:18px;width:min(420px,100%);box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--love);-webkit-text-stroke:1.5px var(--ink);text-wrap:balance}
.how{display:flex;gap:10px;justify-content:center;font-weight:900;font-size:15px;flex-wrap:wrap}
.how div{display:flex;align-items:center;gap:6px}
.how svg{width:40px;height:40px}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.pick{background:#fff;border:4px solid var(--ink);border-radius:14px;padding:6px 2px 4px;cursor:pointer;font-family:var(--body);font-weight:900;font-size:11px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.pick svg{width:100%;max-width:60px;height:62px}
.pick[aria-pressed="true"]{background:var(--pow);transform:translateY(-3px);box-shadow:0 4px 0 var(--ink)}
.pick:focus-visible,.go:focus-visible{outline:4px solid var(--love);outline-offset:2px}
.go{font-family:var(--display);font-size:30px;padding:10px 40px 4px;background:var(--love);color:#fff;border:5px solid var(--ink);border-radius:18px;
  box-shadow:0 6px 0 var(--ink);cursor:pointer;-webkit-text-stroke:1.5px var(--ink)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.bighero{width:130px;height:140px;animation:hover 1.2s ease-in-out infinite alternate}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border:2px solid var(--ink);z-index:49;animation:fall linear forwards;pointer-events:none}

@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes bob{to{transform:translateX(-50%) translateY(-4px)}}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes hover{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes pop{50%{transform:scale(1.3)}}
@keyframes burst{0%{transform:scale(.2) rotate(-20deg);opacity:1}40%{transform:scale(1.1) rotate(0)}100%{transform:scale(1.2);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  #hero{transition-duration:.15s}
}
</style>

<script src="/site.js?v=202610150846" defer></script>
</head>
<body>
<div id="app">
  <header>
    <h1>Super Rescue</h1>
    <a class="home" href="/" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="currentColor"/></svg></a>
    <div class="stars" id="stars" aria-label="Stars earned"></div>
  </header>
  <main class="scene" id="scene">
    <div class="moon"></div>
    <div class="city" id="city"></div>
    <svg id="fx" aria-hidden="true"></svg>
    <div id="hero" class="idle"></div>
  </main>
  <footer>
    <div class="tally" id="jailT"><svg viewBox="0 0 100 100" id="jailIcon"></svg><span id="jailN">0</span><small>Bad guys<br>caught</small></div>
    <div class="tally" id="saveT"><svg viewBox="0 0 100 100"><path d="M50 86 C10 58 8 30 28 22 C40 17 48 26 50 32 C52 26 60 17 72 22 C92 30 90 58 50 86Z" fill="#ff5d8f" stroke="#141018" stroke-width="6" stroke-linejoin="round"/></svg><span id="saveN">0</span><small>People<br>saved</small></div>
  </footer>
</div>

<div class="overlay" id="start">
  <div class="card">
    <h2>Pick your hero!</h2>
    <div class="picks" id="picks"></div>
    <div class="how">
      <div><svg viewBox="0 0 100 100" id="howBad"></svg>Tap to catch</div>
      <div><svg viewBox="0 0 100 100" id="howKid"></svg>Tap to save</div>
    </div>
    <button class="go" id="play">PLAY!</button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="card">
    <h2>You saved the city!</h2>
    <svg class="bighero" id="winHero" viewBox="0 0 100 110"></svg>
    <div class="how"><div id="winText"></div></div>
    <button class="go" id="again">PLAY AGAIN</button>
  </div>
</div>

<script>
(() => {
const INK = '#141018', GOAL = 10;
const HEROES = [
  {name:'Red Rocket', c:'#ff4d4d', power:'Rocket speed'},
  {name:'Blue Bolt', c:'#3fa9ff', power:'Lightning'},
  {name:'Green Gecko', c:'#3ccf6e', power:'Sticky goo'},
  {name:'Pink Pow', c:'#ff6fcf', power:'Bubble trap'}
];
const SHIRTS = ['#3fa9ff','#3ccf6e','#ff9f43','#ff6fcf','#ffd23f'];
const HAIR = ['#6b3e1f','#141018','#e8b13c','#b5462a'];
const POWS = ['POW!','BAM!','ZAP!','BOOM!','WHAM!'];
const YAYS = ['SAVED!','YAY!','THANKS!','HOORAY!'];

const heroSVG = c => `
  <path d="M32 46 L8 104 L50 92 L92 104 L68 46Z" fill="${c}" stroke="${INK}" stroke-width="4" stroke-linejoin="round" opacity=".85"/>
  <rect x="20" y="52" width="14" height="10" rx="5" fill="#ffd2a6" stroke="${INK}" stroke-width="3" transform="rotate(-35 27 57)"/>
  <rect x="66" y="52" width="14" height="10" rx="5" fill="#ffd2a6" stroke="${INK}" stroke-width="3" transform="rotate(35 73 57)"/>
  <rect x="32" y="50" width="36" height="42" rx="14" fill="${c}" stroke="${INK}" stroke-width="4"/>
  <rect x="32" y="78" width="36" height="7" fill="${INK}"/>
  <path d="M50 58 l3.5 7 7.5 1 -5.5 5 1.5 7.5 -7 -3.8 -7 3.8 1.5 -7.5 -5.5 -5 7.5 -1Z" fill="#ffd23f" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="50" cy="32" r="20" fill="#ffd2a6" stroke="${INK}" stroke-width="4"/>
  <path d="M30 28 Q50 2 70 28 Q62 18 50 20 Q38 18 30 28Z" fill="${INK}"/>
  <path d="M30 29 Q50 22 70 29 L70 38 Q50 32 30 38Z" fill="${c}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="42" cy="32" rx="4" ry="3.5" fill="#fff"/><ellipse cx="58" cy="32" rx="4" ry="3.5" fill="#fff"/>
  <circle cx="43" cy="32.5" r="1.8" fill="${INK}"/><circle cx="59" cy="32.5" r="1.8" fill="${INK}"/>
  <path d="M41 42 Q50 50 59 42" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;

const badSVG = () => `
  <circle cx="50" cy="56" r="36" fill="#8e5bd6" stroke="${INK}" stroke-width="5"/>
  <path d="M20 34 Q50 2 80 34 Q50 26 20 34Z" fill="${INK}"/><circle cx="50" cy="12" r="6" fill="${INK}"/>
  <path d="M15 46 Q50 36 85 46 L85 60 Q50 52 15 60Z" fill="${INK}"/>
  <ellipse cx="37" cy="51" rx="7" ry="6" fill="#fff"/><ellipse cx="63" cy="51" rx="7" ry="6" fill="#fff"/>
  <circle cx="38" cy="52" r="3" fill="${INK}"/><circle cx="62" cy="52" r="3" fill="${INK}"/>
  <path d="M38 76 Q50 68 62 76" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
  <path d="M44 78 l3 5 3-5 3 5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>`;

const kidSVG = (shirt, hair) => `
  <g class="arm" style="transform-box:fill-box;transform-origin:50% 100%"><line x1="30" y1="66" x2="16" y2="40" stroke="${INK}" stroke-width="12" stroke-linecap="round"/><line x1="30" y1="66" x2="16" y2="40" stroke="#ffd2a6" stroke-width="6" stroke-linecap="round"/></g>
  <g class="arm" style="transform-box:fill-box;transform-origin:50% 100%;animation-delay:-.25s"><line x1="70" y1="66" x2="84" y2="40" stroke="${INK}" stroke-width="12" stroke-linecap="round"/><line x1="70" y1="66" x2="84" y2="40" stroke="#ffd2a6" stroke-width="6" stroke-linecap="round"/></g>
  <rect x="28" y="62" width="44" height="36" rx="14" fill="${shirt}" stroke="${INK}" stroke-width="4"/>
  <circle cx="50" cy="44" r="22" fill="#ffd2a6" stroke="${INK}" stroke-width="4"/>
  <path d="M28 42 Q30 16 50 18 Q72 16 72 42 Q66 28 50 30 Q36 28 28 42Z" fill="${hair}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="42" cy="44" r="3" fill="${INK}"/><circle cx="58" cy="44" r="3" fill="${INK}"/>
  <ellipse cx="50" cy="55" rx="4" ry="5" fill="${INK}"/>
  <circle cx="36" cy="51" r="3" fill="#ff9aa8" opacity=".7"/><circle cx="64" cy="51" r="3" fill="#ff9aa8" opacity=".7"/>`;

const starPath = 'M50 6 L62 36 L95 38 L70 59 L78 92 L50 74 L22 92 L30 59 L5 38 L38 36Z';
const burstSVG = fill => `<svg viewBox="0 0 100 100"><path d="M50 2 L58 30 L84 12 L70 38 L98 46 L70 56 L86 84 L58 68 L50 98 L42 68 L14 84 L30 56 L2 46 L30 38 L16 12 L42 30Z" fill="${fill}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/></svg>`;

const $ = id => document.getElementById(id);
const scene = $('scene'), city = $('city'), hero = $('hero');
$('jailIcon').innerHTML = badSVG() + `<g stroke="${INK}" stroke-width="5">${[20,38,56,74].map(x=>`<line x1="${x+3}" y1="10" x2="${x+3}" y2="96"/>`).join('')}</g>`;
$('howBad').innerHTML = badSVG();
$('howKid').innerHTML = kidSVG('#3fa9ff','#6b3e1f');

// --- build city: 3 buildings x 3 windows
const wins = [];
for (let b = 0; b < 3; b++) {
  const bl = document.createElement('div'); bl.className = 'bldg';
  for (let f = 0; f < 3; f++) {
    const w = document.createElement('button');
    w.className = 'win'; w.id = `win-${b}-${f}`; w.setAttribute('aria-label','Empty window');
    w.addEventListener('pointerdown', e => { e.preventDefault(); tap(w); });
    w.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(w); } });
    bl.appendChild(w); wins.push(w);
  }
  city.appendChild(bl);
}

// --- stars
const starsEl = $('stars');
for (let i = 0; i < GOAL; i++) starsEl.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 100 100"><path d="${starPath}"/></svg>`);

// --- hero picker
let heroIdx = 0;
const picks = $('picks');
HEROES.forEach((h, i) => {
  const p = document.createElement('button');
  p.className = 'pick'; p.id = `pick-${i}`;
  p.setAttribute('aria-pressed', i === 0);
  p.innerHTML = `<svg viewBox="0 0 100 110">${heroSVG(h.c)}</svg>${h.name}<span class="pw">${h.power}</span>`;
  p.onclick = () => { heroIdx = i; picks.querySelectorAll('.pick').forEach((q,j)=>q.setAttribute('aria-pressed', j===i)); sfx.pick(); };
  picks.appendChild(p);
});

// --- sound
let ac = null;
function audio(){ try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if (ac.state==='suspended') ac.resume(); } catch(e){} }
function tone(f, at, dur, type='square', vol=.07, slide){
  if (!ac) return;
  const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  pick(){ audio(); tone(660,0,.08,'triangle',.08); },
  whoosh(){ tone(300,0,.25,'sine',.05,900); },
  pow(){ tone(220,0,.18,'sawtooth',.09,60); tone(110,.03,.22,'square',.07,50); },
  save(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.14,'triangle',.08)); },
  pop(){ tone(880,0,.06,'sine',.03); },
  rocket(){ tone(150,0,.3,'sawtooth',.06,1400); tone(90,0,.3,'square',.03,300); },
  zap(){ tone(1400,0,.25,'square',.06,90); tone(70,.02,.3,'sawtooth',.07,40); },
  splat(){ tone(500,0,.12,'sine',.1,70); tone(160,.06,.18,'square',.05,60); },
  bubble(){ [500,750,1000,1300].forEach((f,i)=>tone(f,i*.06,.08,'sine',.07)); },
  win(){ [523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.12,.2,'square',.06)); }
};

// --- game state
let jail = 0, saved = 0, spawned = 0, busy = false, timer = null, badCount = 0, kidCount = 0;

function heroHome(){
  const r = scene.getBoundingClientRect();
  hero.style.transform = `translate(${r.width/2 - 38}px, ${r.height*0.06}px)`;
  hero.classList.add('idle');
}
function heroTo(el){
  const s = scene.getBoundingClientRect(), r = el.getBoundingClientRect();
  const x = r.left - s.left + r.width/2 - 38, y = r.top - s.top + r.height/2 - 60;
  hero.classList.remove('idle');
  hero.style.transform = `translate(${x}px, ${y}px) rotate(${x > s.width/2 ? 12 : -12}deg)`;
}

function spawn(){
  const left = GOAL - (jail + saved);
  const active = wins.filter(w => w.dataset.type).length;
  if (active >= Math.min(4, left)) return;
  const empty = wins.filter(w => !w.dataset.type);
  if (!empty.length) return;
  const w = empty[Math.floor(Math.random()*empty.length)];
  // keep it balanced so kids get both kinds
  const type = badCount > kidCount + 1 ? 'kid' : kidCount > badCount + 1 ? 'bad' : (Math.random() < .55 ? 'bad' : 'kid');
  type === 'bad' ? badCount++ : kidCount++;
  w.dataset.type = type;
  w.classList.add('full', type);
  if (type === 'bad') {
    w.innerHTML = `<div class="occ"><svg viewBox="0 0 100 100">${badSVG()}</svg></div>`;
    w.setAttribute('aria-label','Bad guy! Tap to catch');
  } else {
    w.innerHTML = `<div class="help">HELP!</div><div class="occ"><svg viewBox="0 0 100 100">${kidSVG(SHIRTS[Math.random()*SHIRTS.length|0], HAIR[Math.random()*HAIR.length|0])}</svg></div>`;
    w.setAttribute('aria-label','Person needs help! Tap to save');
  }
  sfx.pop();
}

// --- effect helpers
const fx = $('fx'), SVGNS = 'http://www.w3.org/2000/svg';
function ctr(el){ const s = scene.getBoundingClientRect(), r = el.getBoundingClientRect(); return [r.left - s.left + r.width/2, r.top - s.top + r.height/2]; }
function draw(tag, attrs, life){
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  fx.appendChild(e); if (life) setTimeout(() => e.remove(), life); return e;
}
function word(w, text, fill){ w.insertAdjacentHTML('beforeend', `<div class="burst">${burstSVG(fill)}<b>${text}</b></div>`); }
function shrink(w){
  const o = w.querySelector('.occ'); if (!o) return;
  o.style.animation = 'none'; o.style.transition = 'transform .4s'; o.style.transform = 'scale(0)';
}
function cast(){ hero.classList.remove('idle','cast'); void hero.offsetWidth; hero.classList.add('cast'); }
const GOO = `<svg viewBox="0 0 100 100"><path d="M12 50 Q4 16 38 10 Q60 0 82 16 Q100 32 92 60 Q96 90 62 92 Q30 100 14 82 Q0 70 12 50Z" fill="#3ccf6e" fill-opacity=".6" stroke="${INK}" stroke-width="4"/>
  <g stroke="#1f8a45" stroke-width="3.5" stroke-linecap="round">${[28,44,60,76].map(v=>`<line x1="${v}" y1="16" x2="${v}" y2="86"/><line x1="14" y1="${v-4}" x2="90" y2="${v-4}"/>`).join('')}</g>
  <circle cx="30" cy="96" r="5" fill="#3ccf6e" stroke="${INK}" stroke-width="3"/><circle cx="70" cy="98" r="4" fill="#3ccf6e" stroke="${INK}" stroke-width="3"/></svg>`;

// --- each hero catches bad guys a different way; call done() when the bad guy is caught
const POWERS = [
  // Red Rocket: super fast zoom with a fire trail
  (w, done) => {
    sfx.rocket();
    const [x0, y0] = ctr(hero), [x1, y1] = ctr(w);
    hero.classList.add('fast'); heroTo(w);
    for (let i = 0; i < 9; i++) setTimeout(() => {
      const t = i / 8;
      draw('circle', {cx: x0 + (x1-x0)*t, cy: y0 + (y1-y0)*t + 18, r: 9 + Math.random()*6,
        fill: ['#ffd23f','#ff9f43','#ff4d4d'][i%3], stroke: INK, 'stroke-width': 3, class: 'puff'}, 600);
    }, i * 22);
    setTimeout(() => { hero.classList.remove('fast'); sfx.pow(); word(w, 'WHOOSH!', '#ff9f43'); shrink(w); done(); }, 230);
  },
  // Blue Bolt: lightning from where he hovers
  (w, done) => {
    cast(); sfx.zap();
    const [x0, y0] = ctr(hero), [x1, y1] = ctr(w);
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1, nx = -dy/len, ny = dx/len;
    const pts = [[x0, y0]];
    for (let i = 1; i < 7; i++) { const t = i/7, j = (i%2 ? 1 : -1) * 16; pts.push([x0 + dx*t + nx*j, y0 + dy*t + ny*j]); }
    pts.push([x1, y1]);
    const p = pts.map(q => q.join(',')).join(' ');
    draw('polyline', {points: p, fill: 'none', stroke: INK, 'stroke-width': 14, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', class: 'bolt'}, 520);
    draw('polyline', {points: p, fill: 'none', stroke: '#ffe94d', 'stroke-width': 7, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', class: 'bolt'}, 520);
    w.querySelector('.occ')?.classList.add('zapped');
    word(w, 'ZAP!', '#9fdcff');
    setTimeout(() => { shrink(w); done(); }, 380);
  },
  // Green Gecko: shoots a ball of sticky goo
  (w, done) => {
    cast(); sfx.whoosh();
    const [x0, y0] = ctr(hero), [x1, y1] = ctr(w);
    const ball = draw('circle', {cx: x0, cy: y0, r: 13, fill: '#3ccf6e', stroke: INK, 'stroke-width': 4});
    const t0 = performance.now(), D = 260;
    (function fly(now){
      const t = Math.min(1, (now - t0) / D);
      ball.setAttribute('cx', x0 + (x1-x0)*t); ball.setAttribute('cy', y0 + (y1-y0)*t - Math.sin(t*Math.PI)*40);
      if (t < 1) return requestAnimationFrame(fly);
      ball.remove(); sfx.splat();
      const occ = w.querySelector('.occ'); if (occ) occ.style.animation = 'none';
      w.insertAdjacentHTML('beforeend', `<div class="goo">${GOO}</div>`);
      word(w, 'SPLAT!', '#b6f5a0');
      setTimeout(() => { const g = w.querySelector('.goo'); if (g) { g.style.transition = 'transform .4s'; g.style.transform = 'scale(0)'; } shrink(w); done(); }, 450);
    })(t0);
  },
  // Pink Pow: traps them in a bubble that floats away
  (w, done) => {
    sfx.whoosh(); heroTo(w);
    setTimeout(() => {
      sfx.bubble();
      const occ = w.querySelector('.occ'); if (occ) occ.style.animation = 'none';
      w.insertAdjacentHTML('beforeend', '<div class="bub"></div>');
      word(w, 'BUBBLE!', '#ff9ac0');
      heroHome();
      setTimeout(() => { w.querySelector('.bub')?.classList.add('float'); occ?.classList.add('float'); }, 250);
      setTimeout(done, 650);
    }, 380);
  }
];

function finish(w, type){
  setTimeout(() => {
    w.innerHTML = ''; delete w.dataset.type; w.className = 'win'; w.setAttribute('aria-label','Empty window');
    if (type === 'bad') { jail++; bump('jailT','jailN',jail); } else { saved++; bump('saveT','saveN',saved); }
    const n = jail + saved;
    starsEl.children[n-1]?.classList.add('on');
    heroHome(); busy = false;
    if (n >= GOAL) setTimeout(win, 500); else if (!wins.some(x => x.dataset.type)) spawn();
  }, 480);
}

function tap(w){
  const type = w.dataset.type;
  if (!type || busy) return;
  busy = true; audio();
  if (type === 'bad') return POWERS[heroIdx](w, () => finish(w, 'bad'));
  sfx.whoosh(); heroTo(w);
  setTimeout(() => {
    word(w, YAYS[Math.random()*YAYS.length|0], '#ff9ac0'); sfx.save();
    w.querySelector('.help')?.remove(); shrink(w);
    finish(w, 'kid');
  }, 380);
}
function bump(box, num, v){ $(num).textContent = v; const b = $(box); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }

function start(){
  audio(); sfx.pick();
  hero.innerHTML = `<svg viewBox="0 0 100 110">${heroSVG(HEROES[heroIdx].c)}</svg>`;
  jail = saved = spawned = badCount = kidCount = 0; busy = false;
  $('jailN').textContent = 0; $('saveN').textContent = 0;
  [...starsEl.children].forEach(s => s.classList.remove('on'));
  wins.forEach(w => { w.innerHTML=''; delete w.dataset.type; w.className='win'; });
  $('start').hidden = true; $('win').hidden = true;
  document.querySelectorAll('.confetti').forEach(c=>c.remove());
  heroHome();
  clearInterval(timer);
  spawn(); setTimeout(spawn, 500);
  timer = setInterval(spawn, 1500);
}
function win(){
  clearInterval(timer); sfx.win();
  $('winHero').innerHTML = heroSVG(HEROES[heroIdx].c);
  $('winText').textContent = `${HEROES[heroIdx].name} used ${HEROES[heroIdx].power.toLowerCase()} to catch ${jail} bad guys and saved ${saved} people!`;
  $('win').hidden = false;
  const cols = ['#ffd23f','#ff5d8f','#3fa9ff','#3ccf6e','#ff9f43'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw'; c.style.background = cols[i%cols.length];
    c.style.animationDuration = (1.8 + Math.random()*1.8) + 's'; c.style.animationDelay = Math.random()*.8 + 's';
    document.body.appendChild(c);
  }
}

$('play').onclick = start;
$('again').onclick = () => { $('win').hidden = true; $('start').hidden = false; };
window.addEventListener('resize', () => { if (!busy) heroHome(); });
// show the city with a few characters behind the start screen
hero.innerHTML = `<svg viewBox="0 0 100 110">${heroSVG(HEROES[0].c)}</svg>`;
requestAnimationFrame(() => { heroHome(); spawn(); spawn(); spawn(); });
})();
</script>

</body>
</html>
