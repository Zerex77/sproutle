<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bug Squish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: the whole screen is the unicorn's garden drawn on canvas. Slim header on top (title, progress, home);
   the unicorn stands bottom-left and the watering can sits bottom-right. One bright look on purpose. */
:root {
  --grass: #74c94a;
  --grass-deep: #4f9e2c;
  --ink: #23361a;
  --cream: #fffbe8;
  --pink: #ff4fa0;
  --sun: #ffd23f;
  --water: #4cc9f0;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  overflow: hidden; background: var(--grass); color: var(--ink); font-family: var(--display);
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
canvas#fx { pointer-events: none; z-index: 1; }

header {
  position: fixed; left: 0; right: 0; top: 0; z-index: 2;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0;
  display: flex; align-items: center; gap: 12px; pointer-events: none;
}
header > * { pointer-events: auto; }
h1 {
  margin: 0; font-weight: 800; line-height: .9; font-size: clamp(1.4rem, 5.5vw, 2.2rem);
  color: var(--cream); text-shadow: 0 3px 0 var(--grass-deep);
}
.jar {
  flex: 1; min-width: 0; height: 26px; border-radius: 999px; background: #ffffffaa;
  box-shadow: inset 0 2px 0 #0000001a; position: relative;
}
.jar i {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: inherit;
  background: linear-gradient(90deg, #ffb3d9, var(--pink)); transition: width .3s cubic-bezier(.3,1.5,.5,1);
}
.jar b {
  position: absolute; top: 50%; left: 0%; translate: -50% -50%; font-size: 1.6rem; line-height: 1;
  transition: left .3s cubic-bezier(.3,1.5,.5,1); filter: drop-shadow(0 2px 0 #0003);
}
.home {
  display: grid; place-items: center; width: 42px; height: 42px; flex: none; border-radius: 50%;
  background: #fff; color: var(--ink); box-shadow: 0 3px 0 #0000001f;
}
.home:focus-visible, .go:focus-visible, .can:focus-visible, .uni:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

/* the unicorn */
.uni {
  position: fixed; z-index: 2; left: 10px; bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit;
}
.uni .body {
  display: block; font-size: clamp(4.2rem, 19vw, 6.5rem); line-height: 1; transform-origin: 50% 100%;
  filter: drop-shadow(0 6px 0 #00000026); animation: breathe 2.4s ease-in-out infinite;
}
.uni.happy .body { animation: joy .7s ease; }
.uni.sad .body { animation: worry .6s ease; }
.uni::after { /* little patch of clover under her hooves */
  content: ""; position: absolute; left: 8%; right: 8%; bottom: -4px; height: 14px; border-radius: 50%;
  background: #4f9e2c66; z-index: -1;
}
.bubble {
  position: absolute; left: 62%; bottom: 92%; width: max-content; max-width: min(62vw, 260px);
  background: #fff; color: var(--ink); border-radius: 18px; padding: 8px 14px;
  font-weight: 800; font-size: clamp(1rem, 4.2vw, 1.25rem); line-height: 1.15; text-align: left;
  box-shadow: 0 4px 0 #0000001f; animation: pop .25s cubic-bezier(.3,1.6,.5,1);
}
.bubble::after {
  content: ""; position: absolute; left: 16px; bottom: -10px;
  border: 10px solid transparent; border-top-color: #fff; border-bottom: 0; border-left: 0;
}

/* the watering can */
.can {
  position: fixed; z-index: 2; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: clamp(84px, 22vw, 104px); height: clamp(84px, 22vw, 104px); border-radius: 50%; border: 5px solid #fff;
  background: radial-gradient(circle at 35% 30%, #bdeeff, var(--water)); cursor: pointer; padding: 0;
  box-shadow: 0 7px 0 #2a93b8, 0 12px 20px #0002; display: grid; place-items: center;
}
.can svg { width: 72%; height: 72%; transition: transform .2s; }
.can:active { translate: 0 5px; box-shadow: 0 2px 0 #2a93b8; }
.can.pour svg { transform: rotate(-28deg); }
.can .ring {
  position: absolute; inset: -12px; border-radius: 50%; border: 4px dashed #ffffffcc;
  animation: spin 6s linear infinite; pointer-events: none;
}

.screen {
  position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(12px, 2.6vh, 24px); text-align: center; padding-inline: 16px; overflow: hidden;
}
#start { background: radial-gradient(circle at 50% 40%, #a6e57f, var(--grass) 70%); }
#start .hero { font-size: clamp(5rem, 26vw, 8rem); line-height: 1; animation: breathe 2.4s ease-in-out infinite; }
#start .pests { font-size: clamp(2.2rem, 10vw, 3.2rem); line-height: 1; display: flex; gap: 14px; }
#start .pests span { display: inline-block; animation: crawl 1.1s ease-in-out infinite; }
#start .pests span:nth-child(2) { animation-delay: -.35s; } #start .pests span:nth-child(3) { animation-delay: -.7s; }
#start h2 { margin: 0; font-size: clamp(2.6rem, 13vw, 5rem); line-height: .9; color: var(--cream); text-shadow: 0 5px 0 var(--grass-deep); }
#start p { margin: 0; font-weight: 700; font-size: clamp(1.05rem, 4.5vw, 1.3rem); color: var(--ink); max-width: 26ch; text-wrap: balance; }
.go {
  border: 0; cursor: pointer; font: 800 2rem/1 var(--display); color: #fff;
  background: var(--pink); padding: 20px 50px; border-radius: 999px; box-shadow: 0 8px 0 #c7337a;
}
.go:active { translate: 0 6px; box-shadow: 0 2px 0 #c7337a; }

#champ { background: linear-gradient(160deg, #ffd6ec, #fff1b8 45%, #c8f7e3 75%, #cfe6ff); }
#champ .rays {
  position: absolute; width: 220vmax; height: 220vmax; left: 50%; top: 50%; translate: -50% -50%; z-index: -1;
  background: repeating-conic-gradient(#ffffff66 0 10deg, transparent 10deg 20deg); animation: spin 30s linear infinite;
}
#champ .trophy { font-size: clamp(4.5rem, 22vw, 8rem); line-height: 1; animation: bounce 1s ease-in-out infinite; }
#champ h2 {
  margin: 0; font-weight: 800; line-height: .95; font-size: clamp(2.6rem, 13vw, 5.5rem);
  color: var(--pink); text-shadow: 0 4px 0 #fff, 0 8px 0 #0000001a; text-wrap: balance;
}
#champ p { margin: 0; font-weight: 800; font-size: clamp(1.2rem, 5vw, 1.6rem); color: var(--ink); }
.dancers { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px clamp(6px, 2vw, 18px); max-width: 640px; }
.dancer { font-size: clamp(3rem, 15vw, 5.5rem); line-height: 1.1; display: inline-block; transform-origin: 50% 100%; }
.dancer.d0 { animation: hop .6s ease-in-out infinite; }
.dancer.d1 { animation: sway .8s ease-in-out infinite; }
.dancer.d2 { animation: twirl 1.4s ease-in-out infinite; }
.dancer.d3 { animation: wiggle .5s ease-in-out infinite; }
.dancer:nth-child(2n) { animation-delay: -.3s; }
.dancer:nth-child(3n) { animation-delay: -.15s; }
@keyframes hop { 0%,100% { transform: translateY(0) scale(1,1); } 15% { transform: scale(1.15,.85); } 50% { transform: translateY(-38%) scale(.92,1.1); } }
@keyframes sway { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg) translateY(-10%); } }
@keyframes twirl { 0% { transform: rotateY(0) translateY(0); } 50% { transform: rotateY(180deg) translateY(-25%); } 100% { transform: rotateY(360deg) translateY(0); } }
@keyframes wiggle { 0%,100% { transform: translateX(-12%) rotate(-8deg); } 50% { transform: translateX(12%) rotate(8deg); } }
@keyframes crawl { 50% { transform: translateY(-8px) rotate(8deg); } }
@keyframes spin { to { rotate: 360deg; } }
@keyframes bounce { 50% { transform: translateY(-14px) rotate(-6deg); } }
@keyframes breathe { 50% { transform: scale(1.04, .97); } }
@keyframes joy { 0%,100% { transform: none; } 30% { transform: translateY(-28%) rotate(-10deg) scale(1.08); } 60% { transform: translateY(0) scale(1.1, .9); } }
@keyframes worry { 25% { transform: translateX(-8%) rotate(-4deg); } 75% { transform: translateX(8%) rotate(4deg); } }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  #champ .rays, #champ .trophy, .dancer, #start .pests span, #start .hero, .uni .body, .can .ring, .bubble { animation: none !important; }
  .jar i, .jar b { transition: none; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>

<header>
  <h1>Bug<br>Squish</h1>
  <div class="jar" aria-label="Bugs squished"><i id="fill"></i><b id="marker">⭐</b></div>
  <a class="home" href="/" aria-label="All games" title="All games">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="currentColor"/></svg>
  </a>
</header>

<button class="uni" id="uni" aria-label="Unicorn">
  <span class="bubble" id="bubble" hidden></span>
  <span class="body" aria-hidden="true">🦄</span>
</button>

<button class="can" id="can" aria-label="Water the flowers" hidden>
  <span class="ring" aria-hidden="true"></span>
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M14 26h28l-3 28H17z" fill="#ff8fc7" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M42 32l14-12" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M42 32l14-12" stroke="#ff8fc7" stroke-width="3" stroke-linecap="round"/>
    <rect x="51" y="13" width="10" height="7" rx="2" transform="rotate(-40 56 16)" fill="#fff"/>
    <path d="M18 26c0-12 20-12 20 0" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="28" cy="40" r="5" fill="#fff" opacity=".7"/>
  </svg>
</button>

<div class="screen" id="start">
  <div class="hero" aria-hidden="true">🦄</div>
  <h2>Bug Squish!</h2>
  <p>Pesky bugs are in the unicorn's garden. Squish them and water her flowers!</p>
  <div class="pests" aria-hidden="true"><span>🐜</span><span>🪳</span><span>🪰</span></div>
  <button class="go" id="play">Play</button>
</div>

<div class="screen" id="champ" hidden>
  <div class="rays"></div>
  <div class="trophy">🏆</div>
  <h2>BIG WINNER!</h2>
  <p>You saved the unicorn's garden!</p>
  <div class="dancers" id="dancers"></div>
  <button class="go" id="again">Play again!</button>
</div>

<script>
const GOAL = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, dpr, TOP = 80, PS = 50;
let bugs = [], bits = [], plants = [], flies = [], cans = [], squished = 0, playing = false, spawnT = 0, last = 0, clock = 0;

// ---------- garden layout ----------
// flower beds, as fractions of the open lawn between the header and the unicorn / watering can
const BEDS = [[.2, .12], [.78, .04], [.5, .46], [.16, .86], [.84, .8]];
function newPlants() {
  plants = BEDS.map(([fx, fy], i) => ({ fx, fy, x: 0, y: 0, stage: 0, grow: 1, droop: 0, munchers: 0, bounce: 0,
    color: ['#ff6fb5', '#ffd23f', '#b48cff', '#ff8a5c', '#5ad1ff'][i], sway: Math.random() * 6 }));
  placePlants();
}
function placePlants() {
  const y0 = TOP + PS * 1.8, y1 = H - Math.max(130, PS * 2.6);
  for (const p of plants) { p.x = 30 + p.fx * (W - 60); p.y = y0 + p.fy * Math.max(60, y1 - y0); }
}

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  for (const c of [cv, fx]) { c.width = W * dpr; c.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  TOP = document.querySelector('header').getBoundingClientRect().bottom + 10;
  PS = Math.min(W, H) * .08 + 20;
  makeLawn(); placePlants();
}
addEventListener('resize', resize);

// ---------- lawn (drawn once) ----------
let lawn;
function makeLawn() {
  lawn = document.createElement('canvas'); lawn.width = W * dpr; lawn.height = H * dpr;
  const g = lawn.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#74c94a'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#6cbf43';
  for (let x = -H; x < W; x += 120) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 60, 0); g.lineTo(x + 60 + H * .35, H); g.lineTo(x + H * .35, H); g.fill(); }
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.strokeStyle = '#4f9e2c'; g.lineWidth = 2.5; g.lineCap = 'round';
  for (let i = 0; i < W * H / 3500; i++) {
    const x = rnd() * W, y = rnd() * H;
    g.beginPath(); g.moveTo(x - 5, y); g.lineTo(x - 7, y - 9); g.moveTo(x, y); g.lineTo(x, y - 12); g.moveTo(x + 5, y); g.lineTo(x + 8, y - 8); g.stroke();
  }
  // a few tiny clover flowers so the lawn isn't bare
  for (let i = 0; i < W * H / 45000; i++) {
    const x = rnd() * W, y = rnd() * H, r = 3;
    g.fillStyle = '#ffffffcc';
    for (let k = 0; k < 5; k++) { const a = k * 1.2566; g.beginPath(); g.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * .8, 0, 7); g.fill(); }
  }
}

// ---------- sound + voice ----------
let ac;
function audio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
function tone(f, t, d, type = 'sine', v = .2, f2) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + t;
  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d);
}
function noise(len, f1, f2, v, type = 'lowpass', t = 0) {
  if (!ac) return;
  const buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t0 = ac.currentTime + t;
  src.buffer = buf; f.type = type; f.Q.value = 6;
  f.frequency.setValueAtTime(f1, t0); f.frequency.exponentialRampToValueAtTime(f2, t0 + len);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + len);
  src.connect(f).connect(g).connect(ac.destination); src.start(t0);
}
function squishSnd() { noise(.25, 2200, 200, .5); tone(260, 0, .25, 'sine', .25, 90); tone(900 + Math.random() * 400, .08, .18, 'triangle', .08, 1800); }
const missSnd = () => tone(400, 0, .08, 'sine', .06, 250);
const waterSnd = () => { noise(.6, 3000, 1200, .18, 'bandpass'); [0, .12, .24].forEach(t => tone(1300 + Math.random() * 500, t + .1, .08, 'sine', .05, 700)); };
const growSnd = s => [0, 1, 2].forEach(i => tone(440 * Math.pow(1.26, s + i * .5), i * .08, .25, 'triangle', .13));
const bloomSnd = () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .09, .4, 'sine', .14));
const munchSnd = () => { tone(180, 0, .07, 'square', .04, 140); tone(160, .1, .07, 'square', .04, 120); };
const buzzSnd = () => { if (!ac) return; tone(190, 0, .5, 'sawtooth', .025, 210); };
const flutterSnd = () => [1200, 1500, 1800].forEach((f, i) => tone(f, i * .05, .08, 'sine', .06));
function say(text, pitch = 1.4) {
  try { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 1; u.pitch = pitch; speechSynthesis.speak(u); } catch (e) {}
}

// ---------- the unicorn ----------
const uni = document.getElementById('uni'), bubble = document.getElementById('bubble');
let bubbleT, lastTalk = -99;
function unicorn(text, mood, force) {
  if (!force && clock - lastTalk < 3.5) return false;
  lastTalk = clock;
  bubble.textContent = text; bubble.hidden = false;
  bubble.style.animation = 'none'; bubble.offsetWidth; bubble.style.animation = '';
  clearTimeout(bubbleT); bubbleT = setTimeout(() => bubble.hidden = true, 2600);
  if (mood) { uni.classList.remove('happy', 'sad'); uni.offsetWidth; uni.classList.add(mood); }
  say(text, 1.6);
  return true;
}
const THANKS = ['Thank you!', 'Yay! Go away, bugs!', 'You got it!', 'My hero!', 'Squish squish!', 'Good job!'];
const OHNO = ['Oh no! A bug is eating my flower!', 'Help! Bugs on my flowers!', 'Shoo, bug! Squish it!'];
const BLOOM = ['Ooh, so pretty!', 'A flower! I love it!', 'Beautiful!'];
uni.addEventListener('click', () => {
  audio();
  if (!playing) return;
  const anyMunch = bugs.some(b => b.munch && !b.dead);
  unicorn(anyMunch ? 'Squish the bugs on my flowers!' : ['I love my garden!', 'Water my flowers, please!', 'Neigh! Hee hee!'][Math.floor(Math.random() * 3)], 'happy', true);
});

// ---------- bugs: only the pesky kind ----------
const KINDS = [['ant', .35], ['roach', .25], ['hornet', .2], ['fly', .2]];
const GOO = { ant: '#f4a259', roach: '#c5e36b', hornet: '#ffd23f', fly: '#9be7ff' };
const FLYER = { hornet: 1, fly: 1 };
function pickKind() { let r = Math.random(); for (const [k, w] of KINDS) { if ((r -= w) <= 0) return k; } return 'ant'; }
function spawn(magic) {
  const kind = pickKind();
  const s = (Math.min(W, H) * .062 + 16) * ({ ant: .9, roach: 1.15, hornet: 1, fly: .85 })[kind] * (magic ? 1.3 : 1);
  const side = Math.floor(Math.random() * 3);
  let x, y;
  if (side === 0) { x = -s * 1.5; y = TOP + Math.random() * (H - TOP) * .8; }
  else if (side === 1) { x = W + s * 1.5; y = TOP + Math.random() * (H - TOP) * .8; }
  else { x = W * (.25 + Math.random() * .5); y = H + s * 1.5; }
  const speedUp = Math.min(squished, GOAL) * 1.2;
  const b = { x, y, s, kind, ang: Math.atan2(H / 2 - y, W / 2 - x), turn: 0, turnT: 0,
    speed: (FLYER[kind] ? 55 : 40) + Math.random() * 25 + speedUp, phase: Math.random() * 9, dead: 0,
    target: null, rethink: 0, munch: false, munchT: 0, side: Math.random() < .5 ? -1 : 1,
    blob: Array.from({ length: 10 }, () => .75 + Math.random() * .5) };
  if (magic) { b.magic = true; b.hue = Math.random() * 360; b.speed = 32 + Math.random() * 12; }
  bugs.push(b);
  if (magic) { sparkleSnd(); unicorn('Ooh, a sparkly bug! Squish it for a surprise!', 'happy', true); }
  else if (kind === 'hornet') buzzSnd();
}
function aimFor(b) {
  if (b.magic) return null; // sparkly bugs just wander so they're easy to catch
  // bugs head for a grown plant, preferring ones with fewer bugs on them
  const grown = plants.filter(p => p.stage >= 1);
  if (!grown.length || Math.random() < .2) return null;
  grown.sort((a, c) => a.munchers - c.munchers + (Math.random() - .5));
  return grown[0];
}
function goalPoint(b) {
  const p = b.target;
  if (FLYER[b.kind]) { const tip = plantTip(p); return [tip[0] + b.side * PS * .25, tip[1]]; }
  return [p.x + b.side * PS * .32, p.y + PS * .05];
}
function moveBug(b, dt) {
  b.phase += dt * (b.munch ? 8 : b.speed / 6);
  if (b.magic && Math.random() < dt * 14) bits.push({ x: b.x + (Math.random() - .5) * b.s, y: b.y + (Math.random() - .5) * b.s, vx: 0, vy: -30, life: .6, size: 3 + Math.random() * 3, color: `hsl(${(clock * 180 + b.hue) % 360},100%,70%)`, star: true, r: 0 });
  if (b.munch) {
    const p = b.target;
    const [gx, gy] = goalPoint(b);
    b.x += (gx - b.x) * Math.min(1, dt * 4); b.y += (gy - b.y) * Math.min(1, dt * 4);
    if (FLYER[b.kind]) b.y += Math.sin(b.phase * 1.5) * .6;
    b.munchT -= dt;

  if (T > .2 && T < .75 && Math.random() < .8) {
    const sx = x + Math.cos(tilt + Math.PI + .65) * s * .85, sy = y + Math.sin(tilt + Math.PI + .65) * s * .85;
    bits.push({ x: sx, y: sy, vx: (p.x - sx) * .9 + (Math.random() - .5) * 30, vy: 40 + Math.random() * 40, life: .55, size: 3 + Math.random() * 3, color: '#4cc9f0', drop: true });
  }
  return T < 1.05;
}

// ---------- taps ----------
function tap(e) {
  if (!playing) return;
  e.preventDefault(); audio();
  const x = e.clientX, y = e.clientY;
  let hit = null, best = Infinity;
  for (const b of bugs) { if (b.dead) continue; const d = Math.hypot(b.x - x, b.y - y); if (d < b.s * 1.45 && d < best) { best = d; hit = b; } }
  if (hit) {
    hit.dead = .001;
    if (hit.munch && hit.target) hit.target.munchers = Math.max(0, hit.target.munchers - 1);
    squishSnd(); burst(hit.x, hit.y, hit.magic ? '#ffd23f' : GOO[hit.kind], 22);
    navigator.vibrate?.(hit.magic ? [30, 40, 60] : 30);
    squished++; updateJar();
    if (squished >= GOAL) { playing = false; setTimeout(champion, 900); return; }
    if (hit.magic) { flash = .6; for (let i = 0; i < 4; i++) burst(hit.x, hit.y, `hsl(${i * 90},100%,65%)`, 12); setTimeout(() => startEffect(nextEffect()), 250); return; }
    if (!(squished % 4) || hit.munch) unicorn(THANKS[Math.floor(Math.random() * THANKS.length)], 'happy', hit.munch);
    else if (clock - lastTalk > 1.5) say(['Squish!', 'Splat!', 'Got it!'][Math.floor(Math.random() * 3)]);
    return;
  }
  const bf = flies.find(f => Math.hypot(f.x - x, f.y - y) < PS * .6);
  if (bf) { bf.away = 1.2; flutterSnd(); burst(bf.x, bf.y, '#ffffff', 10, true); unicorn("That's a friendly butterfly!", 'happy'); return; }
  burst(x, y, '#d9f99d', 6, true); missSnd();
}
cv.addEventListener('pointerdown', tap);

const fill = document.getElementById('fill'), marker = document.getElementById('marker');
function updateJar() { const p = Math.min(1, squished / GOAL) * 100; fill.style.width = p + '%'; marker.style.left = p + '%'; }

// ---------- particles ----------
function burst(x, y, color, n, small) {
  if (reduce && !small) n = 6;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, sp = (small ? 60 : 140) + Math.random() * (small ? 80 : 240);
    bits.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (small ? 40 : 120), life: small ? .5 : 1,
      size: small ? 3 + Math.random() * 3 : 5 + Math.random() * 7, color: Math.random() < .35 ? '#fff' : color, star: !small && Math.random() < .5, r: Math.random() * 6 });
  }
}
function starPath(c, x, y, ro, ri) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? ri : ro, a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  c.closePath();
}
function confetti(x, y, n) {
  if (reduce) return;
  const cols = ['#ff7a59', '#3ddc97', '#4cc9f0', '#ffd23f', '#c77dff', '#ff4fa0'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, sp = 120 + Math.random() * 260;
    bits.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, life: 1.4, size: 6 + Math.random() * 6, color: cols[i % cols.length], rect: true, r: Math.random() * 6 });
  }
}

// ---------- surprise bugs + screen effects ----------
const EFFECTS = ['rainbow', 'fireworks', 'bubbles', 'stars', 'hearts', 'gallop', 'petals'];
const EFFECT_WORDS = { rainbow: 'A rainbow!', fireworks: 'Fireworks!', bubbles: 'Bubbles everywhere!', stars: 'Shooting stars!',
  hearts: 'I love you!', gallop: 'Wheee! Watch me run!', petals: 'Magic flowers!' };
let effects = [], bag = [], lastFx = '', flash = 0, nextSurprise = 3;
function nextEffect() {
  if (!bag.length) { bag = EFFECTS.slice().sort(() => Math.random() - .5); if (bag[0] === lastFx) bag.push(bag.shift()); }
  return lastFx = bag.shift();
}
function maybeSurprise() {
  if (squished >= nextSurprise && squished < GOAL - 1 && !bugs.some(b => b.magic && !b.dead)) {
    spawn(true); nextSurprise = squished + 4 + Math.floor(Math.random() * 3);
  }
}
const sparkleSnd = () => [1568, 1976, 2349, 2637, 3136].forEach((f, i) => tone(f, i * .06, .2, 'sine', .07));
function effectSnd(type) {
  if (type === 'rainbow' || type === 'petals') [523, 587, 659, 784, 880, 1047, 1175, 1319].forEach((f, i) => tone(f, i * .07, .45, 'sine', .1));
  if (type === 'stars') for (let i = 0; i < 10; i++) tone(1800 + Math.random() * 1600, i * .2, .25, 'sine', .05);
  if (type === 'bubbles') for (let i = 0; i < 14; i++) tone(500 + Math.random() * 700, i * .15, .1, 'sine', .08, 1400);
  if (type === 'hearts') [[523, 659, 784], [587, 740, 880], [659, 831, 988]].forEach((ch, i) => ch.forEach(f => tone(f, i * .35, .6, 'triangle', .06)));
  if (type === 'gallop') { for (let i = 0; i < 16; i++) tone(i % 2 ? 260 : 200, i * .16, .06, 'square', .05, 120); setTimeout(() => say('Neigh! Wheee!', 1.7), 300); }
}
function boomSnd() { noise(.6, 900, 70, .35); for (let i = 0; i < 6; i++) noise(.05, 4000, 2000, .06, 'highpass', .25 + i * .07); }
function startEffect(type) {
  const e = { type, t: 0, dur: 4, items: [], next: 0 }, R = Math.random;
  if (type === 'bubbles') { e.dur = 5; for (let i = 0; i < 34; i++) e.items.push({ x: R() * W, y: H + R() * H * .7, r: 14 + R() * 30, sp: 70 + R() * 90, ph: R() * 6, hue: R() * 360 }); }
  if (type === 'hearts') { e.dur = 4.5; for (let i = 0; i < 26; i++) e.items.push({ x: R() * W, y: H + R() * H * .5, r: 14 + R() * 22, sp: 80 + R() * 80, ph: R() * 6, c: ['#ff4fa0', '#ff7aa8', '#ff2e63', '#ffb3d9'][i % 4] }); }
  if (type === 'stars') { e.dur = 3.6; for (let i = 0; i < 22; i++) e.items.push({ delay: R() * 2.2, x: W * (.2 + R() * 1.1), y: -30 - R() * 80, vx: -(200 + R() * 140), vy: 300 + R() * 180, c: ['#ffd23f', '#fff3a3', '#ffffff', '#9be7ff'][i % 4], sz: 8 + R() * 8 }); }
  if (type === 'fireworks') e.dur = 3.4;
  if (type === 'gallop') { e.dur = 3.2; uni.style.visibility = 'hidden'; }
  if (type === 'petals') {
    for (let i = 0; i < 44; i++) e.items.push({ x: R() * W, y: -20 - R() * H * .45, sp: 110 + R() * 90, ph: R() * 6, c: ['#ff8fc7', '#ffd23f', '#c4a5ff', '#ffffff', '#ff8a5c'][i % 5], r: 6 + R() * 6 });
    plants.filter(p => p.stage === 0 && !p.growing && !pending(p)).forEach((p, i) => setTimeout(() => growPlant(p), 400 + i * 300));
    plants.forEach(p => p.bounce = .6);
  }
  effects.push(e); effectSnd(type);
  unicorn(EFFECT_WORDS[type], 'happy', true);
}
function heartPath(c, x, y, r) {
  c.beginPath(); c.moveTo(x, y + r * .9);
  c.bezierCurveTo(x - r * 1.6, y - r * .2, x - r * .6, y - r * 1.3, x, y - r * .45);
  c.bezierCurveTo(x + r * .6, y - r * 1.3, x + r * 1.6, y - r * .2, x, y + r * .9);
}
const RAINBOW = ['#ff4d4d', '#ff9f1c', '#ffd23f', '#4cd964', '#4cc9f0', '#5b6cff', '#b05cff'];
function drawEffects(dt) {
  const c = fctx;
  effects = effects.filter(e => {
    e.t += dt;
    if (e.t < e.dur) return true;
    if (e.type === 'gallop') uni.style.visibility = '';
    return false;
  });
  for (const e of effects) {
    const T = e.t, fade = Math.max(0, Math.min(1, (e.dur - T) / .8));
    c.save();
    if (e.type === 'rainbow') {
      const cx = W / 2, cy = H * .8, R = Math.max(W * .55, H * .45), band = Math.max(14, R * .075), sweep = Math.min(1, T / 1.1);
      c.globalAlpha = .85 * fade; c.lineWidth = band + 1;
      RAINBOW.forEach((col, i) => { c.strokeStyle = col; c.beginPath(); c.arc(cx, cy, R - i * band, Math.PI, Math.PI + Math.PI * sweep); c.stroke(); });
      const k = band / 14;
      c.fillStyle = '#ffffff';
      for (const sx of [-1, 1]) {
        if (sx === 1 && sweep < 1) continue;
        const fx0 = cx + sx * (R - 3 * band);
        for (const [dx, dy, r] of [[-34, 0, 30], [0, -16, 36], [34, 0, 30], [0, 12, 30]]) { c.beginPath(); c.arc(fx0 + dx * k, cy + dy * k - band, r * k, 0, 7); c.fill(); }
      }
      if (sweep < 1 && !reduce) { const a = Math.PI + Math.PI * sweep; bits.push({ x: cx + Math.cos(a) * (R - 3 * band), y: cy + Math.sin(a) * (R - 3 * band), vx: (Math.random() - .5) * 80, vy: -40, life: .7, size: 4 + Math.random() * 4, color: '#fff', star: true, r: 0 }); }
    }
    if (e.type === 'fireworks') {
      e.next -= dt;
      if (e.next <= 0 && T < e.dur - 1) {
        e.next = .3 + Math.random() * .3;
        const x = W * (.15 + Math.random() * .7), y = TOP + (H - TOP) * (.1 + Math.random() * .4), hue = Math.random() * 360;
        for (let i = 0; i < (reduce ? 10 : 46); i++) { const a = i / 46 * 6.283, sp = 160 + Math.random() * 120; bits.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.1, size: 3 + Math.random() * 3, color: `hsl(${hue + Math.random() * 40},100%,${60 + Math.random() * 20}%)`, star: Math.random() < .3, r: 0 }); }
        e.items.push({ x, y, t: 0, hue }); boomSnd();
      }
      e.items = e.items.filter(r => (r.t += dt) < .5);
      for (const r of e.items) { c.globalAlpha = 1 - r.t * 2; c.strokeStyle = `hsl(${r.hue},100%,80%)`; c.lineWidth = 6; c.beginPath(); c.arc(r.x, r.y, 20 + r.t * 260, 0, 7); c.stroke(); }
    }
    if (e.type === 'bubbles') {
      for (const b of e.items) {
        b.y -= b.sp * dt; b.ph += dt * 2; const x = b.x + Math.sin(b.ph) * 18;
        c.globalAlpha = fade; c.fillStyle = `hsla(${(b.hue + T * 60) % 360},100%,85%,.35)`; c.strokeStyle = '#ffffffdd'; c.lineWidth = 2.5;
        c.beginPath(); c.arc(x, b.y, b.r, 0, 7); c.fill(); c.stroke();
        c.fillStyle = '#ffffffcc'; c.beginPath(); c.ellipse(x - b.r * .35, b.y - b.r * .4, b.r * .25, b.r * .14, -.6, 0, 7); c.fill();
      }
    }
    if (e.type === 'hearts') {
      for (const h of e.items) {
        h.y -= h.sp * dt; h.ph += dt * 2.5; const x = h.x + Math.sin(h.ph) * 20, sc = 1 + Math.sin(h.ph * 2) * .08;
        c.globalAlpha = fade; c.fillStyle = h.c; heartPath(c, x, h.y, h.r * sc); c.fill();
        c.fillStyle = '#ffffff66'; c.beginPath(); c.arc(x - h.r * .45, h.y - h.r * .35, h.r * .2, 0, 7); c.fill();
      }
    }
    if (e.type === 'stars') {
      for (const s of e.items) {
        if (T < s.delay) continue;
        s.x += s.vx * dt; s.y += s.vy * dt;
        const len = .18, g = c.createLinearGradient(s.x, s.y, s.x - s.vx * len, s.y - s.vy * len);
        g.addColorStop(0, s.c); g.addColorStop(1, 'rgba(255,255,255,0)');
        c.globalAlpha = fade; c.strokeStyle = g; c.lineWidth = s.sz * .7; c.lineCap = 'round';
        c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(s.x - s.vx * len, s.y - s.vy * len); c.stroke();
        c.fillStyle = s.c; starPath(c, s.x, s.y, s.sz, s.sz * .45); c.fill();
      }
    }
    if (e.type === 'gallop') {
      const size = Math.min(W, H) * .3 + 40, u = Math.min(1, T / 2.8);
      const x = W + size * .6 - u * (W + size * 1.6), y = H * .45 - Math.abs(Math.sin(T * 9)) * size * .18;
      const band = size * .07, tail = x + size * .35;
      c.lineWidth = band + 1; c.lineCap = 'round';
      RAINBOW.forEach((col, i) => {
        c.strokeStyle = col; c.beginPath();
        for (let px = tail; px < W + 40; px += 12) { const py = y + size * .05 + (i - 3) * band + Math.sin((px - tail) * .02 - T * 8) * size * .06; px === tail ? c.moveTo(px, py) : c.lineTo(px, py); }
        c.globalAlpha = .9; c.stroke();
      });
      c.globalAlpha = 1; c.font = `${size}px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('🦄', x, y);
      if (!reduce && Math.random() < .6) bits.push({ x: x + size * .3, y: y + (Math.random() - .5) * size * .5, vx: 60, vy: -30, life: .8, size: 4 + Math.random() * 4, color: RAINBOW[Math.floor(Math.random() * 7)], star: true, r: 0 });
    }
    if (e.type === 'petals') {
      for (const p of e.items) {
        p.y += p.sp * dt; p.ph += dt * 3; const x = p.x + Math.sin(p.ph) * 25;
        c.globalAlpha = fade; c.fillStyle = p.c; c.save(); c.translate(x, p.y); c.rotate(p.ph);
        c.beginPath(); c.ellipse(0, 0, p.r, p.r * .55, 0, 0, 7); c.fill(); c.restore();
      }
    }
    c.restore();
  }
  if (flash > 0) { c.globalAlpha = Math.min(1, flash) * .7; c.fillStyle = '#fffbe8'; c.fillRect(0, 0, W, H); c.globalAlpha = 1; flash -= dt * 2.2; }
}

// ---------- loop ----------
function frame(now) {
  const t = now / 1000, dt = Math.min(.05, t - (last || t)); last = t; clock += dt;
  ctx.drawImage(lawn, 0, 0, W, H);
  if (playing) {
    spawnT -= dt;
    const want = Math.min(2 + Math.floor(squished / 5), 5) + (W * H > 700000 ? 2 : 0);
    if (spawnT <= 0 && bugs.filter(b => !b.dead).length < want) { spawn(); spawnT = .8 + Math.random() * 1; }
    maybeSurprise();
  }
  for (const p of plants) updatePlant(p, dt);
  for (let i = bugs.length - 1; i >= 0; i--) {
    const b = bugs[i];
    if (b.dead) { b.dead += dt; if (b.dead > 1.8) { bugs.splice(i, 1); continue; } }
    else moveBug(b, dt);
  }
  // splats first, then plants back-to-front, then crawlers, then flyers on top
  for (const b of bugs) if (b.dead) drawBug(b);
  [...plants].sort((a, b) => a.y - b.y).forEach(drawPlant);
  for (const b of bugs) if (!b.dead && !FLYER[b.kind]) drawBug(b);
  for (const b of bugs) if (!b.dead && FLYER[b.kind]) drawBug(b);
  for (const f of flies) drawButterfly(f, dt);
  cans = cans.filter(c => drawCan(c, dt));

  fctx.clearRect(0, 0, W, H);
  bits = bits.filter(p => (p.life -= dt) > 0);
  for (const p of bits) {
    p.vy += (p.rect ? 600 : p.drop ? 900 : 420) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 6;
    fctx.globalAlpha = Math.min(1, p.life * 1.5); fctx.fillStyle = p.color;
    if (p.rect) { fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .66); fctx.restore(); }
    else if (p.star) { starPath(fctx, p.x, p.y, p.size * 1.4, p.size * .6); fctx.fill(); }
    else if (p.drop) { fctx.beginPath(); fctx.ellipse(p.x, p.y, p.size * .6, p.size, 0, 0, 7); fctx.fill(); }
    else { fctx.beginPath(); fctx.arc(p.x, p.y, p.size, 0, 7); fctx.fill(); }
  }
  fctx.globalAlpha = 1;
  drawEffects(dt);
  requestAnimationFrame(frame);
}

// ---------- start / win ----------
const start = document.getElementById('start'), champ = document.getElementById('champ');
let partyTimers = [];
function begin() {
  audio(); squished = 0; updateJar(); bugs = []; bits = []; flies = []; cans = []; newPlants();
  effects = []; bag = []; flash = 0; nextSurprise = 3; uni.style.visibility = '';
  start.hidden = true; champ.hidden = true; canBtn.hidden = false; playing = true; spawnT = 2.5;
  setTimeout(() => unicorn('Help! Squish the bugs and water my flowers!', 'sad', true), 400);
  navigator.wakeLock?.request('screen').catch(() => {});
}
function partySong() {
  const tune = [523, 659, 784, 659, 698, 880, 1047, 880, 784, 988, 1175, 988, 1047];
  tune.forEach((f, i) => { tone(f, i * .16, .22, 'triangle', .14); if (i % 4 === 0) tone(f / 2, i * .16, .3, 'sine', .12); });
}
function champion() {
  const cast = ['🦄', '🌻', '🦋', '🌷', '🦄', '🌸', '🦋', '🌼'];
  const box = document.getElementById('dancers'); box.innerHTML = '';
  cast.forEach((e, i) => box.append(Object.assign(document.createElement('span'), { className: 'dancer d' + (i % 4), textContent: e })));
  champ.hidden = false; canBtn.hidden = true; bubble.hidden = true;
  say("Big winner! You saved the unicorn's garden!", 1.5);
  partySong();
  const song = setInterval(partySong, 2600);
  partyTimers.push(song, setInterval(() => confetti(Math.random() * W, H * (.2 + Math.random() * .3), 35), 450));
  setTimeout(() => clearInterval(song), 2600 * 3);
}
document.getElementById('play').addEventListener('click', begin);
document.getElementById('again').addEventListener('click', () => {
  partyTimers.forEach(clearInterval); partyTimers = [];
  try { speechSynthesis.cancel(); } catch (e) {}
  begin();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

resize(); newPlants();
requestAnimationFrame(frame);
</script>
