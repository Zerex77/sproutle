<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:title" content="Animal Match">

<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Animal Match</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: a soft picnic-blanket table with a grid of chunky cards sized to fill the screen; one bright look on purpose. */
:root {
  --table: #fff4d6;
  --check: #ffe2a8;
  --card-back: #ff7a59;
  --card-back-2: #ffa24c;
  --card-face: #ffffff;
  --ink: #3a2a1a;
  --good: #3ddc97;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font-family: var(--display);
  background:
    repeating-linear-gradient(0deg, transparent 0 40px, #ffd99033 40px 80px),
    repeating-linear-gradient(90deg, transparent 0 40px, #ffd99033 40px 80px),
    var(--table);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
}
#app { height: 100%; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; }
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px 4px;
}
h1 { margin: 0; font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 800; line-height: 1; }
.stars { display: flex; gap: 4px; font-size: 1.6rem; }
.stars span { opacity: .25; transition: opacity .3s, transform .3s; }
.stars span.on { opacity: 1; transform: scale(1.15); }
#board {
  flex: 1; display: grid; gap: 14px; place-content: center; padding-block: 10px 20px;
  min-height: 0;
}
.card {
  position: relative; border: 0; padding: 0; background: none; cursor: pointer;
  perspective: 800px; width: var(--size); height: var(--size);
}
.card:focus-visible { outline: 5px solid var(--ink); outline-offset: 4px; border-radius: 22px; }
.inner {
  position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3,1.4,.5,1);
  transform-style: preserve-3d;
}
.card.up .inner, .card.done .inner { transform: rotateY(180deg); }
.side {
  position: absolute; inset: 0; border-radius: 22px; backface-visibility: hidden;
  -webkit-backface-visibility: hidden; display: grid; place-items: center;
  box-shadow: 0 6px 0 #0000001f, 0 10px 18px #00000014;
}
.back {
  background:
    radial-gradient(circle at 50% 50%, #ffffff55 0 18%, transparent 19%),
    repeating-linear-gradient(45deg, var(--card-back) 0 14px, var(--card-back-2) 14px 28px);
  border: 5px solid #fff;
}
.back::after { content: "?"; color: #fff; font-weight: 800; font-size: calc(var(--size) * .32); text-shadow: 0 3px 0 #0003; }
.face {
  background: var(--card-face); transform: rotateY(180deg); border: 5px solid #fff;
  font-size: calc(var(--size) * .58); line-height: 1;
}
.card.magic .face { background: radial-gradient(circle at 30% 25%, #fff 0 10%, #ffe0f0 40%, #ffc2e2); }
.card.done .face { border-color: var(--good); animation: happy .6s ease; }
.card.nope .inner { animation: shake .4s ease; }
@keyframes happy { 30% { transform: rotateY(180deg) scale(1.15); } 60% { transform: rotateY(180deg) scale(.95); } }
@keyframes shake { 25% { translate: -8px 0; } 75% { translate: 8px 0; } }

#win {
  position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 20px;
  background: #fff4d6ee; text-align: center; padding-inline: 16px;
}
#win .big { font-size: clamp(5rem, 28vw, 9rem); line-height: 1; animation: bounce 1s ease infinite; }
#win h2 { margin: 0; font-size: clamp(2rem, 9vw, 3.4rem); line-height: 1; }
.go {
  border: 0; cursor: pointer; font: 800 1.8rem/1 var(--display); color: #fff;
  background: var(--good); padding: 18px 40px; border-radius: 999px;
  box-shadow: 0 8px 0 #24a56f;
}
.go:active { translate: 0 6px; box-shadow: 0 2px 0 #24a56f; }
.go:focus-visible { outline: 5px solid var(--ink); outline-offset: 5px; }
#start .hint { margin: 0; font-weight: 600; opacity: .7; font-size: 1rem; }
@keyframes bounce { 50% { transform: translateY(-14px) rotate(-6deg); } }
#champ {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(14px, 3vh, 28px); text-align: center; padding-inline: 16px; overflow: hidden;
  background: linear-gradient(160deg, #ffd6ec, #fff1b8 45%, #c8f7e3 75%, #cfe6ff);
}
#champ .rays {
  position: absolute; width: 220vmax; height: 220vmax; left: 50%; top: 50%; translate: -50% -50%; z-index: -1;
  background: repeating-conic-gradient(#ffffff66 0 10deg, transparent 10deg 20deg);
  animation: spin 30s linear infinite;
}
#champ .trophy { font-size: clamp(4.5rem, 22vw, 8rem); line-height: 1; animation: bounce 1s ease-in-out infinite; }
#champ h2 {
  margin: 0; font-weight: 800; line-height: .95; font-size: clamp(2.6rem, 13vw, 5.5rem);
  color: #ff4fa0; text-shadow: 0 4px 0 #fff, 0 8px 0 #0000001a; text-wrap: balance;
}
.dancers { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px clamp(6px, 2vw, 18px); max-width: 640px; }
.dancer { font-size: clamp(3rem, 15vw, 5.5rem); line-height: 1.1; display: inline-block; transform-origin: 50% 100%; }
.dancer.d0 { animation: hop .6s ease-in-out infinite; }
.dancer.d1 { animation: sway .8s ease-in-out infinite; }
.dancer.d2 { animation: twirl 1.4s ease-in-out infinite; }
.dancer.d3 { animation: wiggle .5s ease-in-out infinite; }
.dancer:nth-child(2n) { animation-delay: -.3s; }
.dancer:nth-child(3n) { animation-delay: -.15s; }
@keyframes hop { 0%,100% { transform: translateY(0) scale(1,1); } 15% { transform: scale(1.15,.85); } 50% { transform: translateY(-38%) scale(.92,1.1); } }
@keyframes sway { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg) translateY(-10%); } }
@keyframes twirl { 0% { transform: rotateY(0) translateY(0); } 50% { transform: rotateY(180deg) translateY(-25%); } 100% { transform: rotateY(360deg) translateY(0); } }
@keyframes wiggle { 0%,100% { transform: translateX(-12%) rotate(-8deg); } 50% { transform: translateX(12%) rotate(8deg); } }
@keyframes spin { to { rotate: 360deg; } }
#again { background: #ff4fa0; box-shadow: 0 8px 0 #c7337a; font-size: 2rem; padding: 20px 46px; }
#again:active { box-shadow: 0 2px 0 #c7337a; }
@media (prefers-reduced-motion: reduce) { #champ .rays, #champ .trophy, .dancer { animation: none !important; } }
.hright { display: flex; align-items: center; gap: 12px; }
.home { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: #fff; color: var(--ink); box-shadow: 0 3px 0 #0000001f; }
.home:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .inner { transition: none; } #win .big { animation: none; } .card.done .face, .card.nope .inner { animation: none; }
}
</style>
<script src="/site.js?v=202610150856" defer></script>
</head>
<body>
<div id="app">
  <header>
    <h1>Animal Match</h1>
    <div class="hright"><div class="stars" id="stars" aria-label="Levels won"></div><a class="home" href="/" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="currentColor"/></svg></a></div>
  </header>
  <div id="board"></div>
</div>
<div id="champ" hidden>
  <div class="rays"></div>
  <div class="trophy">🏆</div>
  <h2>BIG WINNER!</h2>
  <div class="dancers" id="dancers"></div>
  <button class="go" id="again">Play again!</button>
</div>
<canvas id="fx"></canvas>

<div id="win">
  <div class="big" id="winIcon">🦄</div>
  <h2 id="winText">Find the twins!</h2>
  <button class="go" id="go">Play</button>
</div>

<script>
const DINOS = [['🦕','Dinosaur'],['🦖','T-Rex'],['🐉','Dragon'],['🐊','Crocodile'],['🐢','Turtle']];
const MAGIC = [['🦄','Unicorn'],['🧚‍♀️','Fairy'],['🦋','Butterfly'],['🌈','Rainbow'],['🧜‍♀️','Mermaid'],['🦩','Flamingo']];
const CRITTERS = [
  ['🐶','Dog'],['🐱','Cat'],['🐮','Cow'],['🐷','Pig'],['🐸','Frog'],['🦁','Lion'],
  ['🐵','Monkey'],['🐻','Bear'],['🐰','Bunny'],['🐘','Elephant'],['🦆','Duck'],['🦒','Giraffe']
];
const ANIMALS = [...DINOS, ...MAGIC, ...CRITTERS];
const MAGIC_NAMES = new Set(MAGIC.map(m => m[1]));
const LEVELS = [2, 3, 4, 6]; // pairs per round; stays at 6 after
const board = document.getElementById('board');
const win = document.getElementById('win');
const starsEl = document.getElementById('stars');
let level = 0, first = null, lock = false, matched = 0, pairs = 0, cards = [];
LEVELS.forEach(() => starsEl.append(Object.assign(document.createElement('span'), { textContent: '⭐' })));

// ---- sound + voice ----
let ac;
function audio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
function tone(f, t, d, type = 'sine', v = .2) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, ac.currentTime + t);
  g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + d);
  o.connect(g).connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + d);
}
const flipSnd = () => tone(660, 0, .12, 'triangle', .15);
const matchSnd = () => [523, 659, 784].forEach((f, i) => tone(f, i * .1, .35));
const nopeSnd = () => { tone(330, 0, .18, 'sine', .12); tone(262, .15, .25, 'sine', .12); };
const winSnd = () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .13, .4, 'triangle', .18));
function say(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = .9; u.pitch = 1.3;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---- layout: biggest square cards that fit ----
function cols(n) { const portrait = innerHeight > innerWidth; if (n <= 4) return 2; if (n <= 6) return portrait ? 2 : 3; if (n <= 8) return portrait ? 2 : 4; return portrait ? 3 : 4; }
function sizeBoard() {
  const n = cards.length; if (!n) return;
  const c = cols(n), r = Math.ceil(n / c), gap = 14;
  const availW = board.clientWidth - 4, availH = board.clientHeight - 30;
  const size = Math.max(60, Math.min((availW - gap * (c - 1)) / c, (availH - gap * (r - 1)) / r, 220));
  board.style.gridTemplateColumns = `repeat(${c}, ${size}px)`;
  board.style.setProperty('--size', size + 'px');
}
addEventListener('resize', sizeBoard);

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function deal() {
  pairs = LEVELS[Math.min(level, LEVELS.length - 1)];
  matched = 0; first = null; lock = true;
  // every round has at least one dino and one magical friend; the rest favor them too
  const d = shuffle(DINOS.slice()), m = shuffle(MAGIC.slice()), c = shuffle(CRITTERS.slice());
  const picks = [d.shift(), m.shift()];
  const pool = shuffle([...d, ...m, ...c.slice(0, 3)]);
  while (picks.length < pairs) picks.push(pool.shift());
  const deck = shuffle([...picks, ...picks]);
  board.innerHTML = '';
  cards = deck.map(([emoji, name], i) => {
    const b = document.createElement('button');
    b.className = 'card up' + (MAGIC_NAMES.has(name) ? ' magic' : ''); b.dataset.name = name; b.id = 'card-' + i;
    b.setAttribute('aria-label', 'Card');
    b.innerHTML = `<div class="inner"><div class="side back"></div><div class="side face">${emoji}</div></div>`;
    b.addEventListener('click', () => pick(b));
    board.append(b); return b;
  });
  sizeBoard();
  // quick peek so little ones get a head start
  setTimeout(() => { cards.forEach(c => c.classList.remove('up')); lock = false; }, 1600 + pairs * 150);
}

function pick(c) {
  audio();
  if (lock || c === first || c.classList.contains('done') || c.classList.contains('up')) return;
  c.classList.add('up'); flipSnd(); say(c.dataset.name);
  if (!first) { first = c; return; }
  const a = first; first = null; lock = true;
  if (a.dataset.name === c.dataset.name) {
    setTimeout(() => {
      a.classList.add('done'); c.classList.add('done'); matchSnd();
      const r = c.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2, 30);
      matched++; lock = false;
      if (matched === pairs) setTimeout(levelWon, 700);
    }, 350);
  } else {
    setTimeout(() => {
      nopeSnd(); a.classList.add('nope'); c.classList.add('nope');
      setTimeout(() => { a.classList.remove('up', 'nope'); c.classList.remove('up', 'nope'); lock = false; }, 700);
    }, 900);
  }
}

function levelWon() {
  winSnd(); say('Yay! You did it!');
  starsEl.children[Math.min(level, LEVELS.length - 1)].classList.add('on');
  for (let i = 0; i < 5; i++) setTimeout(() => confetti(Math.random() * innerWidth, innerHeight * .4, 40), i * 200);
  level++;
  if (level >= LEVELS.length) { setTimeout(champion, 600); return; }
  document.getElementById('winIcon').textContent = shuffle(ANIMALS.slice())[0][0];
  document.getElementById('winText').textContent = 'You did it!';
  document.getElementById('go').textContent = 'Again!';
  win.hidden = false;
}

document.getElementById('go').addEventListener('click', () => {
  audio(); win.hidden = true; deal();
  if (level >= LEVELS.length) starsEl.querySelectorAll('span').forEach(s => s.classList.add('on'));
  navigator.wakeLock?.request('screen').catch(() => {});
});

// ---- big winner party ----
const champ = document.getElementById('champ');
let partyTimers = [];
function partySong() {
  // a bouncy little tune: C E G E | F A C A | G B D B | C
  const tune = [523,659,784,659, 698,880,1047,880, 784,988,1175,988, 1047];
  tune.forEach((f, i) => { tone(f, i * .16, .22, 'triangle', .14); if (i % 4 === 0) tone(f / 2, i * .16, .3, 'sine', .12); });
}
function champion() {
  const cast = ['🦄','🦖','🧚‍♀️','🦕','🦋','🐉','🧜‍♀️','🌈'];
  const box = document.getElementById('dancers'); box.innerHTML = '';
  cast.forEach((e, i) => box.append(Object.assign(document.createElement('span'), { className: 'dancer d' + (i % 4), textContent: e })));
  champ.hidden = false;
  say('Big winner! You matched them all!');
  partySong();
  partyTimers.push(setInterval(partySong, 2600));
  partyTimers.push(setInterval(() => confetti(Math.random() * innerWidth, innerHeight * (.2 + Math.random() * .3), 35), 450));
  setTimeout(() => partyTimers.splice(0, 1).forEach(clearInterval), 2600 * 3); // song plays a few times, confetti keeps going
}
document.getElementById('again').addEventListener('click', () => {
  audio();
  partyTimers.forEach(clearInterval); partyTimers = [];
  try { speechSynthesis.cancel(); } catch (e) {}
  level = 0;
  starsEl.querySelectorAll('span').forEach(s => s.classList.remove('on'));
  champ.hidden = true; deal();
});

// ---- confetti ----
const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
let bits = [], running = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit() { const d = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * d; fx.height = innerHeight * d; fctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', fit); fit();
function confetti(x, y, n) {
  if (reduce) return;
  const cols = ['#ff7a59', '#3ddc97', '#4cc9f0', '#ffd23f', '#c77dff'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = 120 + Math.random() * 260;
    bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 200, r: Math.random() * 6.28, vr: (Math.random() - .5) * 12,
      w: 8 + Math.random() * 8, h: 5 + Math.random() * 5, c: cols[i % cols.length], life: 1.4 });
  }
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
}
let last = 0;
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  bits = bits.filter(b => (b.life -= dt) > 0);
  for (const b of bits) {
    b.vy += 600 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
    fctx.save(); fctx.globalAlpha = Math.min(1, b.life); fctx.translate(b.x, b.y); fctx.rotate(b.r);
    fctx.fillStyle = b.c; fctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); fctx.restore();
  }
  if (bits.length) requestAnimationFrame(tick); else { running = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
