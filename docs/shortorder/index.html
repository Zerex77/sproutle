<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6CC4EC">
<meta name="description" content="Short Order: a free daily diner game. Work the grill, fryer and cold rail to fill eight orders before your customers walk out.">
<link rel="canonical" href="https://playsproutle.com/shortorder/">
<meta property="og:title" content="Short Order">
<meta property="og:description" content="Eight orders. One grill. Don't let it burn. A new shift every day.">
<meta property="og:url" content="https://playsproutle.com/shortorder/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://playsproutle.com/shortorder/icon-512.png">
<link rel="icon" type="image/png" href="/shortorder/icon-192.png">
<link rel="apple-touch-icon" href="/shortorder/apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Short Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: one phone screen, cartoon diner. Customer + order bubble, plate on the pass, then grill / cold rail / fryer+fountain as picture buttons. Single bright look on purpose. */
:root{
  color-scheme:light;
  --sky:#6CC4EC; --wall:#8FD6F5; --ol:#2B1D16; --panel:#FFFFFF; --steel:#C9D6DC; --steel2:#A9BAC2;
  --red:#F2473A; --yellow:#FFC93C; --green:#55C04A; --ink:#2B1D16; --muted:#5A6A72;
  --display:"Lilita One","Arial Rounded MT Bold","Arial Black",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --o:3px; /* outline width */
}
html,body{height:100%}
body{background:var(--sky);background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.35) 0 40px,transparent 41px),radial-gradient(circle at 85% 4%,rgba(255,255,255,.3) 0 28px,transparent 29px);
  color:var(--ink);font-family:var(--body);font-weight:700;font-size:15px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px 10px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.card{background:var(--panel);border:var(--o) solid var(--ol);border-radius:16px;box-shadow:0 4px 0 var(--ol)}
.press:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}

/* top bar */
.top{display:flex;align-items:center;gap:8px}
.logo{font-family:var(--display);font-size:clamp(1.05rem,4.6vw,1.45rem);line-height:1;color:#fff;-webkit-text-stroke:1.5px var(--ol);text-shadow:0 3px 0 var(--ol);letter-spacing:.01em;white-space:nowrap}
.logo span{color:var(--yellow)}
.dots{flex:1;display:flex;gap:3px;justify-content:center;min-width:0}
.dots i{width:10px;height:10px;flex:none;border-radius:50%;background:#fff;border:2px solid var(--ol)}
.dots i.ok{background:var(--green)} .dots i.bad{background:var(--red)} .dots i.now{background:var(--yellow);transform:scale(1.2)}
.cash{font-family:var(--display);font-size:1.15rem;background:var(--green);color:#fff;border:var(--o) solid var(--ol);border-radius:999px;padding:2px 10px;box-shadow:0 3px 0 var(--ol);-webkit-text-stroke:.6px var(--ol);font-variant-numeric:tabular-nums}
.home{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;border:var(--o) solid var(--ol);box-shadow:0 3px 0 var(--ol);flex:none}
.home svg{width:16px;height:16px}
.home.trophy{background:var(--yellow)}
.home.trophy svg{width:20px;height:20px}

/* customer + order bubble */
.order{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;min-height:118px}
.face{width:92px;height:92px;border-radius:50%;padding:6px;background:conic-gradient(var(--pc,var(--green)) calc(var(--pf,1)*360deg),rgba(255,255,255,.5) 0);border:var(--o) solid var(--ol);position:relative}
.face svg{width:100%;height:100%;display:block}
.face.mad{animation:wobble .4s infinite}
@keyframes wobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.bubble{position:relative;padding:8px 10px;min-height:104px;display:flex;align-items:center;justify-content:center;gap:10px}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--ol)}
.bubble::after{content:"";position:absolute;left:-8px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:10px solid #fff}
.bubble .mini{font-size:9px}
.bubble .extras{display:flex;flex-direction:column;gap:4px}
.bubble .extras svg{width:34px;height:34px}
.bubble .num{position:absolute;top:-10px;right:10px;font-family:var(--display);font-size:.8rem;background:var(--yellow);border:2px solid var(--ol);border-radius:999px;padding:0 7px}
.bubble .rush{position:absolute;top:-10px;left:12px;font-family:var(--display);font-size:.75rem;background:var(--red);color:#fff;border:2px solid var(--ol);border-radius:999px;padding:0 7px}
.bubble .q{font-family:var(--display);font-size:3rem;color:var(--steel2);-webkit-text-stroke:2px var(--ol);line-height:1}
.bubble .eye{position:absolute;bottom:-10px;right:10px;font-family:var(--display);font-size:.75rem;background:#fff;border:2px solid var(--ol);border-radius:999px;padding:1px 8px}

/* plate area */
.pass{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:8px;padding:8px 10px 10px;background:linear-gradient(#fff 0 70%,#EAF2F5 70%)}
.burger{font-size:clamp(14px,4.6vw,18px);display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;min-height:8.6em;position:relative;cursor:pointer}
.plate{position:absolute;bottom:-.35em;width:10em;height:.9em;border-radius:50%;background:#fff;border:var(--o) solid var(--ol)}
.mini{display:flex;flex-direction:column-reverse;align-items:center}
.L{border:.15em solid var(--ol);margin-top:-.15em;position:relative;flex:none}
.L.pop{animation:drop .2s ease-out}
@keyframes drop{from{transform:translateY(-1.2em)}to{transform:none}}
.L.bb{width:7.6em;height:1.2em;background:#E9A23B;border-radius:.3em .3em 1em 1em;box-shadow:inset 0 -.25em 0 #C98425}
.L.bt{width:7.6em;height:2.4em;background:#E9A23B;border-radius:3.8em 3.8em .4em .4em/2.4em 2.4em .4em .4em;box-shadow:inset 0 -.3em 0 #C98425;
  background-image:radial-gradient(ellipse .22em .13em at 30% 35%,#FFF6DD 95%,transparent),radial-gradient(ellipse .22em .13em at 55% 22%,#FFF6DD 95%,transparent),radial-gradient(ellipse .22em .13em at 72% 45%,#FFF6DD 95%,transparent),radial-gradient(ellipse .22em .13em at 42% 58%,#FFF6DD 95%,transparent)}
.L.patty{width:8em;height:1.15em;background:#6B3A22;border-radius:.6em;box-shadow:inset 0 .2em 0 #8A5233}
.L.cheese{width:8.3em;height:.6em;background:#FFC93C;border-radius:.15em}
.L.cheese::before,.L.cheese::after{content:"";position:absolute;top:.25em;width:.7em;height:.75em;background:#FFC93C;border:.15em solid var(--ol);border-top:none;border-radius:0 0 .4em .4em}
.L.cheese::before{left:1.3em}.L.cheese::after{right:1.8em;height:.55em}
.L.lettuce{width:8.5em;height:.6em;background:#55C04A;border-radius:.4em;box-shadow:inset 0 -.15em 0 #3E9A36}
.L.tomato{width:7.4em;height:.65em;background:#F2473A;border-radius:.35em;box-shadow:inset 0 -.15em 0 #C8352A}
.L.onion{width:7em;height:.5em;background:#F6EAFB;border-color:#7D4C93;border-radius:.3em;box-shadow:inset 0 0 0 .1em #C9A0DC}
.L.pickles{width:6.6em;height:.5em;background:repeating-linear-gradient(90deg,#6AA232 0 1.6em,#F6F2D4 1.6em 1.8em);border-radius:.3em}
.L.bacon{width:8.2em;height:.55em;background:repeating-linear-gradient(90deg,#C04A30 0 .8em,#F3B39C .8em 1.1em);border-radius:.15em;transform:skewX(-10deg)}
.trays{display:flex;flex-direction:column;gap:6px;align-self:center}
.slot{width:58px;height:58px;border-radius:12px;border:2.5px dashed var(--steel2);display:grid;place-items:center;background:rgba(255,255,255,.6)}
.slot.full{border:var(--o) solid var(--ol);background:#fff}
.slot svg{width:44px;height:44px}
.slot .ghost{opacity:.25;width:30px;height:30px}
.tools{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:flex-end}
.bell{width:76px;height:76px;border-radius:50%;background:var(--red);border:var(--o) solid var(--ol);box-shadow:0 5px 0 var(--ol);display:grid;place-items:center}
.bell svg{width:52px;height:52px}
.bell:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
.trash{width:44px;height:44px;border-radius:50%;background:#fff;border:var(--o) solid var(--ol);box-shadow:0 3px 0 var(--ol);display:grid;place-items:center}
.trash svg{width:22px;height:22px}
.float{position:absolute;left:50%;top:30%;transform:translate(-50%,0);font-family:var(--display);font-size:2.2rem;color:#fff;-webkit-text-stroke:2px var(--ol);text-shadow:0 3px 0 var(--ol);pointer-events:none;animation:rise .9s ease-out forwards;z-index:5;white-space:nowrap}
.float.bad{color:var(--red)}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.1)}to{opacity:0;transform:translate(-50%,-40px) scale(1)}}

/* stations */
.station{display:grid;gap:6px;padding:7px;border-radius:14px;border:var(--o) solid var(--ol);box-shadow:0 4px 0 var(--ol)}
.grillrow{display:grid;grid-template-columns:1fr 1fr 4.4fr;gap:6px}
.crate{border-radius:12px;background:#E3B27A;border:var(--o) solid var(--ol);box-shadow:0 3px 0 var(--ol);display:grid;place-items:center;padding:4px;
  background-image:repeating-linear-gradient(0deg,transparent 0 10px,rgba(0,0,0,.12) 10px 12px)}
.crate svg{width:100%;max-width:46px;height:auto}
.crate:active,.tub:active,.basket:active,.nozzle:active{transform:translateY(3px);box-shadow:0 0 0 var(--ol)}
.grill{grid-template-columns:repeat(4,1fr);background:#3A3D44;background-image:repeating-linear-gradient(90deg,transparent 0 9px,#2C2E33 9px 12px);padding:6px}
.spot{aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;--p:0;--c:var(--yellow)}
.spot.empty{border:2px dashed rgba(255,255,255,.25)}
.spot::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.spot.ready{--c:var(--green)} .spot.empty::after,.spot.burnt::after{display:none}
.spot .it{display:none;border:var(--o) solid var(--ol)}
.spot.patty .it{display:block;width:76%;height:76%;border-radius:50%;background:color-mix(in srgb,#6B3A22 calc(var(--p)*1%),#F28C8E)}
.spot.patty.ready .it{background:#6B3A22 repeating-linear-gradient(-35deg,transparent 0 6px,rgba(0,0,0,.4) 6px 8px)}
.spot.bacon .it{display:block;width:88%;height:36%;border-radius:4px;transform:rotate(-22deg);
  background:repeating-linear-gradient(90deg,color-mix(in srgb,#C04A30 calc(var(--p)*1%),#F28C8E) 0 7px,color-mix(in srgb,#F3B39C calc(var(--p)*1%),#FBD8D0) 7px 10px)}
.spot.bacon.ready .it{background:repeating-linear-gradient(90deg,#C04A30 0 7px,#F3B39C 7px 10px)}
.spot.burnt .it{background:#1B120E!important}
.spot.ready .it{animation:sizzle .35s ease-in-out infinite alternate}
.spot.bacon.ready .it{animation-name:sizzleb}
@keyframes sizzle{to{transform:scale(1.07)}}
@keyframes sizzleb{from{transform:rotate(-22deg)}to{transform:rotate(-22deg) scale(1.07)}}
.spot .chk{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ol);display:none;place-items:center;z-index:2}
.spot.ready .chk{display:grid;background:var(--green)}
.spot.burnt .chk{display:grid;background:#fff}
.spot .chk svg{width:12px;height:12px}
.spot .smoke{position:absolute;inset:0;pointer-events:none;display:none}
.spot.burnt .smoke{display:block}
.smoke i{position:absolute;left:40%;bottom:40%;width:14px;height:14px;border-radius:50%;background:rgba(200,200,200,.85);animation:puff 1.2s ease-out infinite}
.smoke i:nth-child(2){left:55%;animation-delay:.4s}.smoke i:nth-child(3){left:30%;animation-delay:.8s}
@keyframes puff{from{transform:translateY(0) scale(.5);opacity:.9}to{transform:translateY(-30px) scale(1.4);opacity:0}}
.shake{animation:shake .25s!important}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.coldrail{grid-template-columns:repeat(6,1fr);background:linear-gradient(var(--steel),var(--steel2))}
.tub{aspect-ratio:1;border-radius:10px;background:#E8EEF1;border:var(--o) solid var(--ol);box-shadow:0 3px 0 var(--ol);padding:5px;display:grid}
.tub{position:relative}.tub .f{border-radius:5px;border:2px solid rgba(43,29,22,.35)}
.tub .slice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8,2.2);font-size:clamp(5px,1.6vw,6.4px);display:flex;justify-content:center}
.f-cheese{background:linear-gradient(135deg,#FFC93C 46%,#E9AF22 46% 54%,#FFC93C 54%) 0 0/12px 12px}
.f-lettuce{background:radial-gradient(circle at 30% 30%,#8BDB6E 30%,transparent 32%) 0 0/12px 12px,#55C04A}
.f-tomato{background:radial-gradient(circle,#FF8B7E 18%,#F2473A 20% 46%,transparent 48%) 0 0/15px 15px,#C8352A}
.f-onion{background:radial-gradient(circle,transparent 26%,#B07CC6 28% 40%,transparent 42%) 0 0/13px 13px,#F6EAFB}
.f-pickles{background:radial-gradient(circle,#A6CF66 26%,#6AA232 28% 46%,transparent 48%) 0 0/12px 12px,#4C7A22}
.f-salad{border-radius:50%!important;background:radial-gradient(circle at 35% 40%,#F2473A 12%,transparent 13%),radial-gradient(circle at 65% 62%,#8BDB6E 18%,transparent 19%),radial-gradient(circle at 60% 30%,#F6EAFB 10%,transparent 11%),#55C04A}

.back{grid-template-columns:1fr 1fr .25fr 1fr 1fr 1fr;background:linear-gradient(var(--steel),var(--steel2));align-items:end}
.basket{aspect-ratio:.85;border-radius:10px;background:#FFC93C;border:var(--o) solid var(--ol);box-shadow:0 3px 0 var(--ol);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;position:relative;--p:0;overflow:hidden}
.basket svg{width:80%;height:auto}
.basket .bar{width:80%;height:6px;border-radius:3px;background:rgba(43,29,22,.2);overflow:hidden}
.basket .bar b{display:block;height:100%;width:calc(var(--p)*1%);background:var(--ol)}
.basket.empty svg{opacity:.35}
.basket.cooking{animation:bub .35s infinite alternate}
@keyframes bub{to{background:#FFD866}}
.basket.ready{background:var(--green);animation:hop .5s infinite alternate}
@keyframes hop{to{transform:translateY(-3px)}}
.sep{align-self:stretch;width:3px;justify-self:center;background:var(--ol);border-radius:2px;opacity:.25}
.nozzle{aspect-ratio:.85;border-radius:10px;background:#fff;border:var(--o) solid var(--ol);box-shadow:0 3px 0 var(--ol);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:3px;position:relative;overflow:hidden}
.nozzle .tap{position:absolute;top:0;left:50%;width:22px;height:9px;margin-left:-11px;background:var(--drink);border:2px solid var(--ol);border-top:none;border-radius:0 0 6px 6px}
.nozzle .stream{position:absolute;top:9px;left:50%;width:4px;margin-left:-2px;height:0;background:var(--drink)}
.nozzle.pouring .stream{height:40%}
.nozzle svg{width:70%;height:auto}

/* screens */
.screen{padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.steps div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem;line-height:1.2}
.steps svg{width:56px;height:56px}
.big-btn{font-family:var(--display);font-size:1.4rem;color:#fff;background:var(--red);border:var(--o) solid var(--ol);border-radius:16px;box-shadow:0 5px 0 var(--ol);padding:12px 26px;-webkit-text-stroke:.8px var(--ol);width:100%}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
.sm-btn{font-weight:900;background:#fff;border:var(--o) solid var(--ol);border-radius:12px;box-shadow:0 3px 0 var(--ol);padding:9px 16px;width:100%}
.sm-btn:active{transform:translateY(3px);box-shadow:none}
.tipbig{font-family:var(--display);font-size:3.2rem;line-height:1;color:var(--green);-webkit-text-stroke:2px var(--ol);text-shadow:0 4px 0 var(--ol)}
.grid{font-size:1.7rem;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats div{border:2px solid var(--ol);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.stats span{font-size:.7rem;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);margin:0}
textarea.share{width:100%;font-family:ui-monospace,monospace;font-size:.85rem;border:2px solid var(--ol);border-radius:8px;padding:8px}
#slb{width:100%;text-align:left;border:2px solid var(--ol);border-radius:12px;padding:10px;background:#FFF8DC}
#slb:empty{display:none}
@media (max-height:700px){.order{min-height:100px}.face{width:78px;height:78px}.order{grid-template-columns:82px 1fr}.burger{min-height:7.8em}.bell{width:66px;height:66px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body>
<div class="wrap">
  <div class="top">
    <div class="logo">Short <span>Order</span></div>
    <div class="dots" id="dots"></div>
    <div class="cash" id="cash">$0</div>
    <button class="home trophy" id="lbBtn" aria-label="Today's leaderboard"><svg viewBox="0 0 24 24" fill="#fff" stroke="#2B1D16" stroke-width="2.4" stroke-linejoin="round"><path d="M7 3h10v6a5 5 0 0 1-10 0z"/><path d="M7 5H3.5v1.5A3.5 3.5 0 0 0 7 10M17 5h3.5v1.5A3.5 3.5 0 0 1 17 10" fill="none"/><path d="M12 14v4M8 21h8l-1-3H9z"/></svg></button>
    <a class="home" href="/" aria-label="All games"><svg viewBox="0 0 24 24" fill="none" stroke="#2B1D16" stroke-width="3"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></a>
  </div>

  <!-- start -->
  <section class="card screen" id="startScreen">
    <div class="steps">
      <div><span id="st1"></span>Cook it<br><small>(don't burn it)</small></div>
      <div><span id="st2"></span>Stack it<br><small>like the picture</small></div>
      <div><span id="st3"></span>Ring it<br><small>before they leave</small></div>
    </div>
    <p class="note">8 customers. Same orders for everyone today.<br>Orders 6–8 hide after 4 seconds. Tap 👀 to peek.</p>
    <button class="big-btn" id="startBtn">Open the diner</button>
  </section>

  <!-- game -->
  <section id="game" hidden style="display:flex;flex-direction:column;gap:8px">
    <div class="order">
      <div class="face" id="face"></div>
      <button class="card bubble" id="bubble" aria-label="Order"></button>
    </div>

    <div class="card pass" id="pass">
      <div class="trays">
        <button class="slot" id="sideSlot" aria-label="Side"></button>
        <button class="slot" id="drinkSlot" aria-label="Drink"></button>
      </div>
      <button class="burger" id="burger" aria-label="Burger, tap to pull off the top layer"></button>
      <div class="tools">
        <button class="trash" id="trashBtn" aria-label="Toss plate"></button>
        <button class="bell" id="bellBtn" aria-label="Serve"></button>
      </div>
    </div>

    <div class="grillrow">
      <button class="crate" id="cratePatty" aria-label="Raw patty"></button>
      <button class="crate" id="crateBacon" aria-label="Raw bacon"></button>
      <div class="station grill" id="grill"></div>
    </div>
    <div class="station coldrail" id="cold"></div>
    <div class="station back" id="back"></div>
  </section>

  <!-- end -->
  <section class="card screen" id="endScreen" hidden>
    <div class="note" id="endLabel"></div>
    <div class="tipbig" id="endTips">$0</div>
    <div class="grid" id="endGrid"></div>
    <div id="slb"></div>
    <div class="stats" id="stats"></div>
    <button class="big-btn" id="shareBtn">Share</button>
    <div class="note" id="copied"></div>
    <textarea class="share" id="shareText" rows="4" readonly hidden></textarea>
    <button class="sm-btn" id="practiceBtn">Practice shift</button>
    <p class="note">New orders tomorrow</p>
  </section>
</div>

<script src="/lb.js"></script>
<script>
(function(){
const OL='#2B1D16';
const svg=(b,vb)=>'<svg viewBox="'+(vb||'0 0 40 40')+'" fill="none" stroke="'+OL+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">'+b+'</svg>';
const ICON={
  Fries:svg('<path d="M12 6v14M16 4v16M20 5v15M24 4v16M28 6v14" stroke="#2B1D16" stroke-width="6"/><path d="M12 6v14M16 4v16M20 5v15M24 4v16M28 6v14" stroke="#FFC93C" stroke-width="3"/><path d="M8 17h24l-3 19H11z" fill="#F2473A"/><path d="M15 23l2 3 3-3 3 3 2-3" stroke="#fff"/>'),
  Rings:svg('<circle cx="14" cy="22" r="9" stroke-width="8" stroke="#2B1D16"/><circle cx="14" cy="22" r="9" stroke-width="4" stroke="#E2953A"/><circle cx="26" cy="17" r="9" stroke-width="8" stroke="#2B1D16"/><circle cx="26" cy="17" r="9" stroke-width="4" stroke="#F0AE4E"/>'),
  Salad:svg('<circle cx="14" cy="18" r="6" fill="#55C04A"/><circle cx="24" cy="16" r="6" fill="#8BDB6E"/><circle cx="20" cy="20" r="3" fill="#F2473A"/><path d="M5 20h30a15 13 0 0 1-30 0z" fill="#fff"/>'),
  Cola:cup('#5A2A14'),Lemonade:cup('#FFE16A'),Shake:svg('<path d="M24 2l-3 12" stroke-width="3"/><path d="M11 13a9 7 0 0 1 18 0z" fill="#fff"/><path d="M9 14h22l-3 23H12z" fill="#F7A8C2"/><circle cx="23" cy="8" r="3" fill="#F2473A"/>')
};
function cup(c){return svg('<path d="M24 2l-3 12" stroke-width="3"/><path d="M9 12h22l-3 25H12z" fill="'+c+'"/><path d="M9 12h22" stroke-width="3"/><rect x="8" y="9" width="24" height="4" rx="2" fill="#fff"/><path d="M12 20h16" stroke="#fff" stroke-width="2" opacity=".6"/>')}
const RAWPAT=svg('<ellipse cx="20" cy="27" rx="15" ry="7" fill="#F28C8E"/><ellipse cx="20" cy="20" rx="15" ry="7" fill="#F28C8E"/><ellipse cx="20" cy="13" rx="15" ry="7" fill="#F7A7A8"/>');
const RAWBAC=svg('<path d="M5 12q8-5 15 0t15 0v6q-8 5-15 0t-15 0z" fill="#F28C8E"/><path d="M5 22q8-5 15 0t15 0v6q-8 5-15 0t-15 0z" fill="#F7A7A8"/><path d="M8 14q6-3 12 1M8 24q6-3 12 1" stroke="#FBE3DC" stroke-width="2"/>');
const BELL=svg('<path d="M8 30a12 12 0 0 1 24 0z" fill="#FFC93C"/><rect x="5" y="30" width="30" height="5" rx="2" fill="#FFC93C"/><circle cx="20" cy="15" r="3" fill="#FFC93C"/><path d="M14 22a6 6 0 0 1 4-3" stroke="#fff"/>');
const TRASH=svg('<path d="M8 11h24M16 11V7h8v4" stroke-width="3"/><path d="M11 11l2 23h14l2-23z" fill="#C9D6DC"/><path d="M17 16v13M23 16v13"/>');
const CHECK=svg('<path d="M9 21l7 7 15-16" stroke="#fff" stroke-width="5"/>');
const X=svg('<path d="M10 10l20 20M30 10L10 30" stroke="#2B1D16" stroke-width="5"/>');

const FILL=['patty','cheese','lettuce','tomato','onion','pickles','bacon'];
const COLD=['cheese','lettuce','tomato','onion','pickles'];
const SIDES=['Fries','Rings','Salad'], DRINKS=['Cola','Lemonade','Shake'];
const DCOL={Cola:'#5A2A14',Lemonade:'#FFE16A',Shake:'#F7A8C2'};
const SKIN=['#F5CBA7','#E0AC69','#C68642','#8D5524','#FFDBAC','#F1C27D'], HAIR=['#2B1D16','#6B3A22','#E9A23B','#C04A30','#8A8A8A','#3B2F8C'];
const COOK={patty:3.5,bacon:2.5}, BURN=6, FRY=3, POUR=1.2;
const N=8, RUSH_AT=5, FLIP_MS=4000, PEEK_COST=2, PEEK_MS=1500;
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function localDate(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=localDate();
// Shared puzzle number across playsproutle.com daily games (No. 1 = Oct 13, 2026)
const dayNum=Math.max(1,Math.round((new Date(today+'T00:00:00')-new Date('2026-10-13T00:00:00'))/864e5)+1);
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function makeOrders(seed){
  const r=rng(seed),pick=a=>a[Math.floor(r()*a.length)],out=[];
  for(let i=0;i<N;i++){
    const n=Math.min(6,2+Math.floor(i/2)+(r()<.3?1:0)),layers=[];
    for(let j=0;j<n;j++){const hot=layers.filter(l=>l==='patty'||l==='bacon').length;
      let f=r()<.3?'patty':pick(FILL);if((f==='patty'||f==='bacon')&&hot>=3)f=pick(COLD);layers.push(f)}
    if(!layers.includes('patty'))layers[0]='patty';
    const side=r()<.45+i*.05?pick(SIDES):null, drink=r()<.45+i*.05?pick(DRINKS):null;
    const hot=layers.filter(l=>l==='patty'||l==='bacon').length;
    const patience=Math.round(9+n*1.8+4+hot*1.6+(side?2.5:0)+(drink?2:0)-i*.5);
    out.push({layers,side,drink,patience,look:{skin:pick(SKIN),hair:pick(HAIR),style:Math.floor(r()*4)}});
  }
  return out;
}

/* cartoon customer, three moods */
function faceSVG(L,mood){
  const hair=[
    '<path d="M18 38q2-22 32-22t32 22q-10-8-32-8t-32 8z" fill="'+L.hair+'"/>',
    '<circle cx="50" cy="12" r="10" fill="'+L.hair+'"/><path d="M18 38q2-22 32-22t32 22q-10-8-32-8t-32 8z" fill="'+L.hair+'"/>',
    '<path d="M16 34q4-20 34-20t34 20z" fill="#F2473A"/><path d="M70 32h20v6H70z" fill="#F2473A"/>',
    '<path d="M22 30q6-12 28-12t28 12" stroke-width="6" stroke="'+L.hair+'"/>'][L.style];
  const brows=mood==='mad'?'<path d="M30 40l12 5M70 40l-12 5" stroke-width="4"/>':mood==='meh'?'<path d="M30 42h12M58 42h12" stroke-width="4"/>':'<path d="M30 41q6-4 12 0M58 41q6-4 12 0" stroke-width="3.5"/>';
  const mouth=mood==='happy'?'<path d="M36 66q14 14 28 0z" fill="#fff"/>':mood==='meh'?'<path d="M38 70h24" stroke-width="4"/>':'<path d="M36 74q14-12 28 0" stroke-width="4"/>';
  const cheeks=mood==='mad'?'<circle cx="28" cy="62" r="6" fill="#F2473A" opacity=".5" stroke="none"/><circle cx="72" cy="62" r="6" fill="#F2473A" opacity=".5" stroke="none"/>':'';
  return '<svg viewBox="0 0 100 100" fill="none" stroke="'+OL+'" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">'+
    '<circle cx="50" cy="54" r="34" fill="'+L.skin+'"/>'+cheeks+hair+brows+
    '<circle cx="38" cy="52" r="4" fill="'+OL+'"/><circle cx="62" cy="52" r="4" fill="'+OL+'"/>'+mouth+'</svg>';
}
function burgerHTML(layers,top,pop){let h='<div class="L bb"></div>';
  layers.forEach((l,i)=>{h+='<div class="L '+l+(pop&&i===layers.length-1?' pop':'')+'"></div>'});
  if(top)h+='<div class="L bt'+(top==='pop'?' pop':'')+'"></div>';return h}

let S=null,raf=0;
const KEY='shortorder-v1', STATS='shortorder:stats';

/* ---- build controls ---- */
$('st1').innerHTML='<span style="display:inline-block;width:56px;height:56px;border-radius:50%;background:#3A3D44;border:3px solid '+OL+';position:relative"><span style="position:absolute;inset:10px;border-radius:50%;background:#6B3A22;border:3px solid '+OL+'"></span></span>';
$('st2').innerHTML='<span class="mini" style="font-size:6px;display:inline-flex">'+burgerHTML(['patty','cheese','lettuce'],true)+'</span>';
$('st3').innerHTML='<span style="display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--red);border:3px solid '+OL+'">'+BELL.replace('<svg','<svg width="36" height="36"')+'</span>';
$('cratePatty').innerHTML=RAWPAT;$('crateBacon').innerHTML=RAWBAC;$('bellBtn').innerHTML=BELL;$('trashBtn').innerHTML=TRASH;
const spots=[];
for(let i=0;i<4;i++){const b=document.createElement('button');b.className='spot empty';b.setAttribute('aria-label','Grill');
  b.innerHTML='<span class="it"></span><span class="chk"></span><span class="smoke"><i></i><i></i><i></i></span>';b.onclick=()=>tapSpot(i);$('grill').appendChild(b);spots.push(b)}
COLD.concat(['salad']).forEach(id=>{const b=document.createElement('button');b.className='tub';b.setAttribute('aria-label',id);
  b.innerHTML='<span class="f f-'+id+'"></span>'+(id==='salad'?'':'<span class="slice"><span class="L '+id+'"></span></span>');b.onclick=()=>id==='salad'?plateSide('Salad',b):add(id);$('cold').appendChild(b)});
const baskets=['Fries','Rings'].map((t,i)=>{const b=document.createElement('button');b.className='basket empty';b.setAttribute('aria-label',t);
  b.innerHTML=ICON[t]+'<span class="bar"><b></b></span>';b.onclick=()=>tapBasket(i);$('back').appendChild(b);return b});
const sep=document.createElement('span');sep.className='sep';$('back').appendChild(sep);
const nozzles=DRINKS.map(d=>{const b=document.createElement('button');b.className='nozzle';b.style.setProperty('--drink',DCOL[d]);b.setAttribute('aria-label',d);
  b.innerHTML='<span class="tap"></span><span class="stream"></span>'+ICON[d];b.onclick=()=>pour(d);$('back').appendChild(b);return b});
$('cratePatty').onclick=()=>toGrill('patty');$('crateBacon').onclick=()=>toGrill('bacon');
$('sideSlot').onclick=()=>{if(live()){S.side=null;drawPlate()}};
$('drinkSlot').onclick=()=>{if(live()){S.drink=null;drawPlate()}};
$('burger').onclick=()=>{if(live()&&S.stack.length){S.stack.pop();drawBurger()}};
$('trashBtn').onclick=()=>{if(!live())return;S.stack=[];S.side=null;S.drink=null;drawBurger();drawPlate()};
$('bellBtn').onclick=serve;
$('bubble').onclick=peek;

const live=()=>S&&S.phase==='play';
const now=()=>performance.now();
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),260)}
function cookState(it,t,cook,burn){const e=(t-it.t0)/1000;
  if(e<cook)return{st:'cooking',p:e/cook*100};
  if(burn==null||e<cook+burn)return{st:'ready',p:burn==null?100:100-(e-cook)/burn*100};
  return{st:'burnt',p:0}}
function toGrill(type){if(!live())return;const i=S.grill.findIndex(g=>!g);
  if(i<0){shake($('grill'));return}S.grill[i]={type,t0:now()};drawStations()}
function tapSpot(i){if(!live())return;const g=S.grill[i];if(!g){toGrill('patty');return}
  const c=cookState(g,now(),COOK[g.type],BURN);
  if(c.st==='cooking'){shake(spots[i]);return}
  S.grill[i]=null;if(c.st!=='burnt')add(g.type);drawStations()}
function tapBasket(i){if(!live())return;const f=S.fry[i];
  if(!f){S.fry[i]={t0:now()};drawStations();return}
  if(cookState(f,now(),FRY,null).st==='cooking'){shake(baskets[i]);return}
  S.fry[i]=null;plateSide(i?'Rings':'Fries');drawStations()}
function pour(d){if(!live())return;if(S.pour){shake(nozzles[DRINKS.indexOf(d)]);return}S.pour={d,t0:now()};drawStations()}
function plateSide(s){if(!live())return;S.side=s;drawPlate()}
function add(id){if(!live())return;if(S.stack.length>=8){shake($('burger'));return}S.stack.push(id);drawBurger(true)}

function drawStations(){
  const t=now();
  S.grill.forEach((g,i)=>{const el=spots[i];let cls='spot empty',p=0,st='';
    if(g){const c=cookState(g,t,COOK[g.type],BURN);cls='spot '+g.type+' '+c.st;p=c.p;st=c.st}
    const keep=el.classList.contains('shake')?' shake':'';if(el.className!==cls+keep)el.className=cls+keep;
    el.style.setProperty('--p',p.toFixed(1));
    const ck=el.children[1],want=st==='ready'?'r':st==='burnt'?'b':'';if(ck.dataset.s!==want){ck.dataset.s=want;ck.innerHTML=want==='r'?CHECK:want==='b'?X:''}});
  S.fry.forEach((f,i)=>{const el=baskets[i];let st='empty',p=0;if(f){const c=cookState(f,t,FRY,null);st=c.st;p=c.p}
    const keep=el.classList.contains('shake')?' shake':'';if(el.className!=='basket '+st+keep)el.className='basket '+st+keep;el.style.setProperty('--p',p.toFixed(1))});
  nozzles.forEach((n,i)=>n.classList.toggle('pouring',!!(S.pour&&S.pour.d===DRINKS[i])));
  if(S.pour&&(t-S.pour.t0)/1000>=POUR){S.drink=S.pour.d;S.pour=null;drawPlate()}
}

/* ---- flow ---- */
function start(mode){
  const seed=mode==='daily'?hash('shortorder-'+today):Math.floor(Math.random()*1e9);
  S={mode,orders:makeOrders(seed),idx:0,results:[],score:0,phase:'play',grill:[null,null,null,null],fry:[null,null],pour:null};
  $('startScreen').hidden=true;$('endScreen').hidden=true;$('game').hidden=false;$('cash').textContent='$0';
  if(mode==='daily'&&window.SLB)SLB.start('shortorder',dayNum);
  nextOrder();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
function nextOrder(){
  const o=S.orders[S.idx];
  S.stack=[];S.side=null;S.drink=null;S.top=false;S.left=o.patience;S.max=o.patience;S.shownAt=now();S.peekUntil=0;S.last=now();S.phase='play';S.mood='';
  drawDots();drawBubble();drawBurger();drawPlate();updFace();
}
function drawDots(){$('dots').innerHTML=Array.from({length:N},(_,i)=>{const r=S&&S.results[i];return '<i class="'+(r?(r==='late'||r==='wrong'?'bad':'ok'):(S&&i===S.idx&&S.phase!=='done'?'now':''))+'"></i>'}).join('')}
function hidden(){if(S.idx<RUSH_AT)return false;const t=now();return t-S.shownAt>FLIP_MS&&t>S.peekUntil}
function drawBubble(){
  const o=S.orders[S.idx],h=hidden();S.hidDrawn=h;
  let x='<span class="num">'+(S.idx+1)+'/'+N+'</span>'+(S.idx>=RUSH_AT?'<span class="rush">RUSH</span>':'');
  if(h)x+='<span class="q">?</span><span class="eye">👀 −2s</span>';
  else x+='<span class="mini">'+burgerHTML(o.layers,true)+'</span>'+((o.side||o.drink)?'<span class="extras">'+(o.side?ICON[o.side]:'')+(o.drink?ICON[o.drink]:'')+'</span>':'');
  $('bubble').innerHTML=x;
}
function peek(){if(!live()||!hidden())return;S.left=Math.max(.1,S.left-PEEK_COST);S.peekUntil=now()+PEEK_MS;drawBubble()}
function drawBurger(pop){$('burger').innerHTML='<span class="plate"></span>'+burgerHTML(S.stack,S.top?'pop':false,pop)}
function drawPlate(){
  const s=$('sideSlot'),d=$('drinkSlot');
  s.classList.toggle('full',!!S.side);s.innerHTML=S.side?ICON[S.side]:'<span class="ghost">'+ICON.Fries+'</span>';
  d.classList.toggle('full',!!S.drink);d.innerHTML=S.drink?ICON[S.drink]:'<span class="ghost">'+ICON.Cola+'</span>';
}
function updFace(){const f=S.left/S.max,m=f>.5?'happy':f>.22?'meh':'mad',el=$('face');
  el.style.setProperty('--pf',f.toFixed(3));el.style.setProperty('--pc',f>.5?'var(--green)':f>.22?'var(--yellow)':'var(--red)');
  if(m!==S.mood){S.mood=m;el.innerHTML=faceSVG(S.orders[S.idx].look,m);el.classList.toggle('mad',m==='mad')}}
function pop(text,bad){const f=document.createElement('div');f.className='float'+(bad?' bad':'');f.textContent=text;$('pass').appendChild(f);setTimeout(()=>f.remove(),950)}
function serve(){
  if(!live())return;const o=S.orders[S.idx];
  const ok=o.layers.length===S.stack.length&&o.layers.every((l,i)=>l===S.stack[i])&&o.side===S.side&&o.drink===S.drink;
  if(ok){const tip=Math.round(5+o.layers.length*2+(o.side?2:0)+(o.drink?2:0)+S.left*1.5);
    S.score+=tip;S.results[S.idx]=S.left/S.max>=.5?'perfect':'ok';S.top=true;drawBurger();finish('+$'+tip,false)}
  else{S.results[S.idx]='wrong';shake($('pass'));finish('Nope!',true)}
}
function finish(text,bad){
  S.phase='between';$('cash').textContent='$'+S.score;drawDots();pop(text,bad);
  if(bad){S.mood='';const f=$('face');f.innerHTML=faceSVG(S.orders[S.idx].look,'mad');f.classList.add('mad')}
  setTimeout(()=>{S.idx++;if(S.idx>=N)end();else nextOrder()},950);
}
function tick(t){
  raf=requestAnimationFrame(tick);if(!S)return;
  if(S.phase==='play'||S.phase==='between')drawStations();
  if(S.phase!=='play')return;
  if(document.querySelector('.slb-scrim')){const d=t-S.last;S.last=t;S.shownAt+=d;S.peekUntil+=d;for(const g of S.grill)if(g)g.t0+=d;for(const f of S.fry)if(f)f.t0+=d;if(S.pour)S.pour.t0+=d;return}
  const dt=Math.min(.25,(t-S.last)/1000);S.last=t;S.left-=dt;
  if(S.left<=0){S.left=0;S.results[S.idx]='late';updFace();finish('Bye!',true);return}
  updFace();if(S.idx>=RUSH_AT&&hidden()!==S.hidDrawn)drawBubble();
}
document.addEventListener('visibilitychange',()=>{if(S)S.last=now()});

const EMO={perfect:'🍔',ok:'🟩',wrong:'🟥',late:'⏰'};
function end(){
  cancelAnimationFrame(raf);S.phase='done';drawDots();const res={results:S.results,score:S.score};
  if(S.mode==='daily'){store.set(KEY,{n:dayNum,results:res.results,score:res.score});if(window.SLB)SLB.stop('shortorder',dayNum);
    const st=store.get(STATS)||{played:0,best:0,streak:0,last:null};
    if(st.last!==today){const y=new Date();y.setDate(y.getDate()-1);st.streak=st.last===localDate(y)?st.streak+1:1;st.played++;st.best=Math.max(st.best,S.score);st.last=today;store.set(STATS,st)}}
  showEnd(res,S.mode);
}
function showEnd(res,mode){
  $('startScreen').hidden=true;$('game').hidden=true;$('endScreen').hidden=false;
  $('endLabel').textContent=mode==='daily'?'Shift #'+dayNum:'Practice shift';
  $('endTips').textContent='$'+res.score;$('cash').textContent='$'+res.score;
  $('endGrid').textContent=res.results.map(r=>EMO[r]).join('');
  const st=store.get(STATS)||{played:0,best:0,streak:0};
  $('stats').innerHTML='<div><b>'+st.played+'</b><span>shifts</span></div><div><b>$'+st.best+'</b><span>best</span></div><div><b>'+st.streak+'</b><span>streak</span></div>';
  $('shareBtn').hidden=mode!=='daily';$('copied').textContent='';$('shareText').hidden=true;$('slb').innerHTML='';
  if(mode==='daily'&&window.SLB)SLB.mount($('slb'),Object.assign({},LB,{score:9999-res.score,eligible:true}));
}
$('shareBtn').onclick=()=>{const res=store.get(KEY);if(!res||res.n!==dayNum)return;
  const txt='Short Order #'+dayNum+' 🍳 $'+res.score+'\n'+res.results.map(r=>EMO[r]).join('')+'\nplaysproutle.com/shortorder';
  const fb=()=>{const ta=$('shareText');ta.value=txt;ta.hidden=false;ta.select();$('copied').textContent='Copy the text above'};
  try{navigator.clipboard.writeText(txt).then(()=>{$('copied').textContent='Copied!'},fb)}catch(e){fb()}};
const LB={game:'shortorder',day:dayNum,fmt:x=>'$'+(9999-x),note:'Most tips wins. Ties go to the fastest.',accent:'var(--red)',accentInk:'#fff'};
$('lbBtn').onclick=()=>{if(!window.SLB)return;const d=store.get(KEY),mine=d&&d.n===dayNum;
  SLB.open(Object.assign({},LB,{score:mine?9999-d.score:0,eligible:!!mine,title:"Today's top 10",panelBg:'#FFF8DC',panelInk:'#2B1D16'}))};
$('startBtn').onclick=()=>start('daily');$('practiceBtn').onclick=()=>start('practice');
document.addEventListener('keydown',e=>{if(!live())return;if(e.key==='Enter'){serve();e.preventDefault()}else if(e.key==='Backspace'){$('burger').click();e.preventDefault()}});

drawDots();
const done=store.get(KEY);if(done&&done.n===dayNum)showEnd(done,'daily');
})();
</script>
</body>
</html>
