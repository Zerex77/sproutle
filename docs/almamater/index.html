].map(([team,year,...ps])=>({team,year,players:ps.map(s=>{const[pos,name,college]=s.split("|");return{pos,name,college}})}));

const MAX=4;
const OLPOS=["LT","LG","C","RG","RT"];
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function dayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
// Puzzle No. 1 = Oct 13, 2026 (local date), shared with the other daily games
const pNo=(()=>{const d=new Date();return Math.max(1,Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,9,13))/864e5)+1)})();
function dailyIndex(){const n=pNo-1;
  // fixed shuffle so consecutive days don't follow list order
  const order=L.map((_,i)=>i);let s=7741;for(let i=order.length-1;i>0;i--){s=(s*16807)%2147483647;const j=s%(i+1);[order[i],order[j]]=[order[j],order[i]]}
  return order[((n%L.length)+L.length)%L.length]}

let mode="daily",cur,guesses,done,endless=store.get("am_endless",{streak:0,best:0,last:-1});

function start(){
  if(mode==="daily"){
    cur=dailyIndex();
    const saved=store.get("almamater-v1",null),d=saved&&saved.day;
    guesses=d&&d.n===pNo?d.guesses.slice():[];
  }else{
    let i;do{i=Math.floor(Math.random()*L.length)}while(L.length>1&&i===endless.last);
    cur=i;endless.last=i;guesses=[];
  }
  done=false;render();
}
function save(){if(mode!=="daily")return;const ans=L[cur].team,won=guesses.includes(ans),lost=!won&&guesses.length>=MAX;
  store.set("almamater-v1",{day:{n:pNo,guesses,status:won?"won":lost?"lost":"playing"}})}

// school → [code, fill, ring]
const S={"Wisconsin":["WIS","#C5050C","#ffffff"],"California":["CAL","#003262","#FDB515"],"Penn State":["PSU","#041E42","#ffffff"],"Notre Dame":["ND","#0C2340","#C99700"],"Stanford":["STAN","#8C1515","#ffffff"],"Arizona State":["ASU","#8C1D40","#FFC627"],"Oklahoma State":["OKST","#FF7300","#000000"],"Alabama":["BAMA","#9E1B32","#ffffff"],"Oregon":["ORE","#154733","#FEE123"],"NC State":["NCST","#CC0000","#ffffff"],"Louisville":["LOU","#AD0000","#000000"],"Tennessee":["TENN","#FF8200","#ffffff"],"Georgia":["UGA","#BA0C2F","#000000"],"Georgia Tech":["GT","#003057","#B3A369"],"Minnesota":["MINN","#7A0019","#FFCC33"],"Texas Tech":["TTU","#CC0000","#000000"],"Portland State":["PRST","#154734","#ffffff"],"Southern Miss":["USM","#000000","#FFAB00"],"Utah":["UTAH","#CC0000","#ffffff"],"Miami":["MIA","#F47321","#005030"],"Auburn":["AUB","#0C2340","#E87722"],"Coastal Carolina":["CCU","#006F71","#A27752"],"Ohio State":["OSU","#BB0000","#A7B1B7"],"Ole Miss":["MISS","#CE1126","#14213D"],"USC":["USC","#990000","#FFC72C"],"LSU":["LSU","#461D7C","#FDD023"],"Oregon State":["ORST","#DC4405","#000000"],"Oklahoma":["OU","#841617","#FDF9D8"],"West Alabama":["UWA","#CC0000","#ffffff"],"Clemson":["CLEM","#F56600","#522D80"],"Cincinnati":["CIN","#E00122","#000000"],"Central Michigan":["CMU","#6A0032","#FFC82E"],"South Florida":["USF","#006747","#CFC493"],"McGill (Canada)":["MCG","#ED1B2F","#ffffff"],"Boston College":["BC","#8A100B","#BC9B6A"],"Florida State":["FSU","#782F40","#CEB888"],"Rutgers":["RU","#CC0033","#000000"],"Abilene Christian":["ACU","#4F2683","#ffffff"],"Texas A&M":["TAMU","#500000","#ffffff"],"Valdosta State":["VSU","#CC0000","#000000"],"Michigan":["MICH","#00274C","#FFCB05"],"Kent State":["KENT","#002664","#EAAB00"],"Monmouth":["MONM","#041E42","#ffffff"],"Colorado":["COLO","#000000","#CFB87C"],"TCU":["TCU","#4D1979","#ffffff"],"North Dakota State":["NDSU","#0A5640","#FFC72A"],"South Carolina":["SCAR","#73000A","#000000"],"Maryland":["MD","#E03A3E","#FFD520"],"Miami (OH)":["M-OH","#C3142D","#ffffff"],"Eastern Washington":["EWU","#A10022","#000000"],"Western Kentucky":["WKU","#C60C30","#ffffff"],"Indiana":["IND","#990000","#EEEDEB"],"Iowa":["IOWA","#000000","#FFCD00"],"Hobart":["HOB","#4B2E83","#F47C20"],"Colorado State-Pueblo":["CSUP","#CC0000","#00205B"],"Humboldt State":["HSU","#00553E","#FFD200"],"Pittsburgh":["PITT","#003594","#FFB81C"],"West Virginia":["WVU","#002855","#EAAA00"],"Texas":["TEX","#BF5700","#ffffff"],"Kansas":["KU","#0051BA","#E8000D"],"South Dakota State":["SDST","#0033A0","#FFD100"],"None (rugby)":["—","#5b6b6e","#ffffff"],"Iowa State":["ISU","#C8102E","#F1BE48"],"Harvard":["HARV","#A51C30","#ffffff"],"UCLA":["UCLA","#2D68C4","#F2A900"],"UTSA":["UTSA","#0C2340","#F15A22"],"Arkansas":["ARK","#9D2235","#ffffff"],"UCF":["UCF","#000000","#BA9B37"],"Kentucky Wesleyan":["KWC","#4F2D7F","#ffffff"],"Delaware":["DEL","#00539F","#FFD200"],"East Carolina":["ECU","#592A8A","#FDC82F"],"Florida":["FLA","#0021A5","#FA4616"],"Kentucky":["UK","#0033A0","#ffffff"],"Nebraska":["NEB","#E41C38","#ffffff"],"Western Michigan":["WMU","#6C4023","#B5A167"],"Alcorn State":["ALCN","#46166B","#E9A900"],"San Jose State":["SJSU","#0055A2","#E5A823"],"Boise State":["BSU","#0033A0","#D64309"],"Illinois":["ILL","#E84A27","#13294B"],"Virginia":["UVA","#232D4B","#F84C1E"],"BYU":["BYU","#002E5D","#ffffff"],"Michigan State":["MSU","#18453B","#ffffff"],"Marshall":["MRSH","#00B140","#ffffff"],"UMass":["MASS","#881C1C","#ffffff"],"North Carolina":["UNC","#7BAFD4","#13294B"],"Cornell":["COR","#B31B1B","#ffffff"],"Lane College":["LANE","#0F2C58","#C8102E"],"Nevada":["NEV","#003366","#807F84"],"Idaho":["IDHO","#000000","#B3A369"],"Eastern Illinois":["EIU","#004B83","#9A9A9A"],"Baylor":["BAY","#154734","#FFB81C"],"SMU":["SMU","#0033A0","#C8102E"],"Memphis":["MEM","#003087","#898D8D"],"Northern Illinois":["NIU","#BA0C2F","#000000"],"Purdue":["PUR","#000000","#CEB888"],"Arkansas-Pine Bluff":["UAPB","#000000","#FFC72C"],"Ball State":["BALL","#BA0C2F","#ffffff"],"Duke":["DUKE","#003087","#ffffff"],"Florida Atlantic":["FAU","#003366","#CC0000"],"Pittsburg State":["PITST","#CC0033","#FFCC00"],"Temple":["TEM","#9D2235","#ffffff"],"Missouri":["MIZ","#F1B82D","#000000"],"Eastern Michigan":["EMU","#006633","#ffffff"],"Minnesota State":["MNST","#4F2D7F","#FFC72C"],"Houston":["HOU","#C8102E","#ffffff"],"Fresno State":["FRES","#DB0032","#002E6D"],"UTEP":["UTEP","#FF8200","#041E42"],"Indiana State":["INST","#00669A","#ffffff"],"Mississippi State":["MSST","#660000","#ffffff"],"Michigan Tech":["MTU","#000000","#FFCD00"],"Northern Iowa":["UNI","#4B116F","#FFCC00"],"Charlotte":["CLT","#046A38","#ffffff"],"FIU":["FIU","#081E3F","#B6862C"],"Hofstra":["HOF","#003591","#FFD100"],"Toledo":["TOL","#15397F","#FFDA00"],"Towson":["TOW","#000000","#FFBB00"],"Bloomsburg":["BLOOM","#861F41","#FFC72C"],"Northwestern":["NW","#4E2A84","#ffffff"],"Colorado State":["CSU","#1E4D2B","#C8C372"],"Wyoming":["WYO","#492F24","#FFC425"],"Arizona":["ARIZ","#CC0033","#0C234B"]};
function inkFor(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(0.299*r+0.587*g+0.114*b)>165?"#111":"#fff"}
function formation(q){
  const LOS=86,R=17,by=p=>q.players.filter(x=>x.pos===p),one=p=>q.players.find(x=>x.pos===p);
  const spots=[];const put=(p,x,y,lab)=>p&&spots.push({p,x,y,lab});
  OLPOS.forEach((pos,i)=>put(one(pos),120+i*40,LOS,"top"));
  const te=by("TE"),wr=by("WR"),fb=one("FB");
  put(te[0],320,LOS,"top");put(te[1],80,LOS,"top");
  put(wr[0],26,LOS,"top");put(wr[1],374,LOS,"top");put(wr[2],346,LOS+44,"side");
  put(one("QB"),200,LOS+44,"side");
  if(fb){put(fb,200,LOS+88,"side");put(one("RB"),200,LOS+132,"side")}else put(one("RB"),200,LOS+100,"side");
  const H=LOS+(fb?160:128);
  const xs=[60,130,200,270,340].map((x,i)=>`<g stroke="currentColor" stroke-width="2.5" opacity=".28"><line x1="${x-7}" y1="${26+(i%2)*8}" x2="${x+7}" y2="${40+(i%2)*8}"/><line x1="${x+7}" y1="${26+(i%2)*8}" x2="${x-7}" y2="${40+(i%2)*8}"/></g>`).join("");
  const yard=[LOS-40,LOS+40,LOS+120].map(y=>`<line x1="0" x2="400" y1="${y}" y2="${y}" stroke="currentColor" opacity=".08"/>`).join("");
  const o=spots.map(({p,x,y,lab},i)=>{const[code,fill,ring]=S[p.college]||[p.college.slice(0,4).toUpperCase(),"#5b6b6e","#ffffff"];
    const fs=code.length>4?8.5:code.length>3?10:11.5;
    const label=lab==="top"?`<text x="${x}" y="${y-R-6}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--gold)" letter-spacing=".5">${p.pos}</text>`
      :`<text x="${x+R+6}" y="${y+4}" font-size="10" font-weight="800" fill="var(--gold)" letter-spacing=".5">${p.pos}</text>`;
    return`<g class="o" style="animation-delay:${i*30}ms"><circle cx="${x}" cy="${y}" r="${R}" fill="${fill}" stroke="${ring}" stroke-width="3.5"/><text x="${x}" y="${y+fs*0.36}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${inkFor(fill)}">${code}</text>${label}</g>`}).join("");
  return`<svg viewBox="0 0 400 ${H}" role="img" aria-label="Offensive formation with each player's college colors" style="color:var(--chalk)">${yard}${xs}${o}</svg>`;
}

function render(){
  const q=L[cur],ans=q.team,won=guesses.includes(ans),misses=guesses.filter(g=>g!==ans).length;
  done=won||misses>=MAX;
  $("formation").innerHTML=formation(q);
  const ro=$("roster");ro.hidden=!done;
  ro.innerHTML=done?q.players.map(p=>`<li><b>${p.pos}</b>${p.name} <span>· ${p.college}</span></li>`).join(""):"";
  $("dots").innerHTML=Array.from({length:MAX},(_,i)=>`<span class="dot ${i<misses?"used":(won&&i===misses?"win":"")}"></span>`).join("");
  $("stat").innerHTML=mode==="daily"?`Puzzle <b>No. ${pNo}</b>`:`Streak <b>${endless.streak}</b> · Best <b>${endless.best}</b>`;
  const qb=q.players.find(p=>p.pos==="QB");
  const clues=[["Season",q.year],["Division",DIV_OF[ans]],["QB",qb.name]];
  $("hints").innerHTML=clues.map(([k,v],i)=>{const on=misses>i||done;return`<span class="hint ${on?"on":""}">${k}: <b>${on?v:"?"}</b></span>`}).join("");
  const msg=$("msg");
  if(won){msg.className="msg good";msg.textContent=misses?`Got it on guess ${misses+1}.`:"First try."}
  else if(done){msg.className="msg bad";msg.textContent="Out of guesses."}
  else if(misses){msg.className="msg bad";msg.textContent=`Not the ${NAMES[guesses[guesses.length-1]]}. Clue unlocked.`}
  else{msg.className="msg";msg.textContent="Pick a team from the list."}
  const sel=$("team"),keep=sel.value;
  sel.innerHTML=`<option value="">Choose a team…</option>`+Object.entries(DIVS).map(([d,ts])=>`<optgroup label="${d}">${ts.map(t=>`<option value="${t}" ${guesses.includes(t)?"disabled":""}>${CITY[t]} ${NAMES[t]}${guesses.includes(t)?"  ✗":""}</option>`).join("")}</optgroup>`).join("");
  sel.value=guesses.includes(keep)?"":keep;$("go").disabled=!sel.value;
  $("tried").innerHTML=guesses.filter(g=>g!==ans).map(g=>`<span class="chip">${NAMES[g]}</span>`).join("");
  $("pick").hidden=done;$("tried").hidden=done;
  const r=$("result");
  if(done){
    r.hidden=false;r.className="result";
    const grid=guesses.map(g=>g===ans?"🟩":"🟥").join("");
    const shareText=`Alma Mater ${mode==="daily"?"No. "+pNo:"Endless"} ${won?guesses.length:"X"}/${MAX}\n${grid}\nplaysproutle.com/almamater`;
    r.innerHTML=`<h2>${q.year} ${NAMES[ans]}</h2>${mode==="daily"?`<pre class="share" id="share">${shareText}</pre><button class="next" id="copy">Copy result</button><div id="slb"></div>`:`<button class="next" id="again">Next lineup</button>`}`;
    const c=$("copy");if(c)c.onclick=()=>{navigator.clipboard.writeText(shareText).then(()=>c.textContent="Copied").catch(()=>{const s=getSelection(),rg=document.createRange();rg.selectNodeContents($("share"));s.removeAllRanges();s.addRange(rg);c.textContent="Selected, copy it"})};
    if(mode==="daily"&&window.SLB)SLB.mount($("slb"),{game:"almamater",day:pNo,score:guesses.length,eligible:won,fmt:n=>n+"/"+MAX,note:"Fewest guesses wins. Ties go to the fastest.",accent:"var(--teal)",accentInk:"#fff",detail:{team:ans,year:q.year,guesses},renderDetail:d=>d.guesses.map(g=>(g===d.team?"🟩 ":"🟥 ")+NAMES[g]).join("<br>")});
    const a=$("again");if(a)a.onclick=()=>{start();window.scrollTo({top:0,behavior:"smooth"})};
  }else r.hidden=true;
}

$("team").addEventListener("change",e=>{$("go").disabled=!e.target.value});
$("pick").addEventListener("submit",e=>{
  e.preventDefault();
  const t=$("team").value;if(!t||done||guesses.includes(t))return;
  guesses.push(t);$("team").value="";
  if(mode==="daily"&&window.SLB){if(guesses.length===1)SLB.start("almamater",pNo)}
  const ans=L[cur].team,won=t===ans,lost=!won&&guesses.filter(g=>g!==ans).length>=MAX;
  if(mode==="endless"&&(won||lost)){endless.streak=won?endless.streak+1:0;endless.best=Math.max(endless.best,endless.streak)}
  if(mode==="daily"&&(won||lost)&&window.SLB)SLB.stop("almamater",pNo);
  store.set("am_endless",endless);save();render();
  if(won||lost)$("result").scrollIntoView({behavior:"smooth",block:"start"});
});
function setMode(m){mode=m;$("mDaily").setAttribute("aria-pressed",m==="daily");$("mEndless").setAttribute("aria-pressed",m==="endless");start()}
$("mDaily").onclick=()=>setMode("daily");$("mEndless").onclick=()=>setMode("endless");
start();
</script>
