<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7cc4f0">
<meta name="description" content="Trailhead: a free daily word climb. Pick your trail up the mountain and solve a hidden five-letter word at each stop.">
<link rel="canonical" href="https://playsproutle.com/trailhead/">
<meta property="og:title" content="Trailhead">
<meta property="og:description" content="Climb a spring mountain one word at a time. Choose your path by category. A new climb every day.">
<meta property="og:url" content="https://playsproutle.com/trailhead/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://playsproutle.com/trailhead/icon-512.png">
<link rel="icon" type="image/png" href="/trailhead/icon-192.png">
<link rel="apple-touch-icon" href="/trailhead/apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Trailhead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: two full-screen views. A spring alpine climb (chalet at the bottom, snowy summit at the top, clouds above the next row) and a word screen (grid + an edge-to-edge keyboard tray). */
:root{
  --bg:#f2f8ef; --ink:#1f3326; --ink-soft:#5b6f60; --line:#cddcc9; --tile:#ffffff;
  --sky1:#8ccaef; --sky2:#e4f4fb; --far:#a9bed3; --snow:#ffffff; --rock:#a7b2a0;
  --slope1:#8cc46c; --slope2:#5f9f4a; --meadow1:#a3d473; --meadow2:#c3e48d; --pine:#2f6b3f; --sun:#ffe7a0;
  --cloud:rgba(255,255,255,.95); --cloud-hi:#ffffff; --trail:#f7efd9;
  --accent:#2f8a4a; --on-accent:#ffffff; --hit:#3c9a50; --near:#dcae22; --miss:#8a978e; --fail:#c66f79; --on-mark:#ffffff;
  --tray:#dfe9dc; --key:#ffffff; --key-ink:#1f3326; --key-edge:#b4c4b1;
  --display:'Fredoka','Atkinson Hyperlegible',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1916; --ink:#e7f0e9; --ink-soft:#9fb2a5; --line:#2d4136; --tile:#1a2822;
  --sky1:#10203b; --sky2:#2d4668; --far:#2f425b; --snow:#d8e3ee; --rock:#4b554f;
  --slope1:#38643a; --slope2:#284d2c; --meadow1:#3d6c36; --meadow2:#4b7b40; --pine:#173620; --sun:#eeead2;
  --cloud:rgba(40,55,76,.95); --cloud-hi:rgba(78,96,122,.95); --trail:#c9bf9f;
  --accent:#6cc485; --on-accent:#0d1f14; --hit:#3f8f52; --near:#c9a233; --miss:#4b5751; --fail:#b0606a; --on-mark:#ffffff;
  --tray:#16211d; --key:#2b3b34; --key-ink:#eef4ef; --key-edge:#0b1310; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1916; --ink:#e7f0e9; --ink-soft:#9fb2a5; --line:#2d4136; --tile:#1a2822;
  --sky1:#10203b; --sky2:#2d4668; --far:#2f425b; --snow:#d8e3ee; --rock:#4b554f;
  --slope1:#38643a; --slope2:#284d2c; --meadow1:#3d6c36; --meadow2:#4b7b40; --pine:#173620; --sun:#eeead2;
  --cloud:rgba(40,55,76,.95); --cloud-hi:rgba(78,96,122,.95); --trail:#c9bf9f;
  --accent:#6cc485; --on-accent:#0d1f14; --hit:#3f8f52; --near:#c9a233; --miss:#4b5751; --fail:#b0606a; --on-mark:#ffffff;
  --tray:#16211d; --key:#2b3b34; --key-ink:#eef4ef; --key-edge:#0b1310; color-scheme:dark}

html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.4;padding-inline:12px;padding-block:8px 0;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
.app{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
h1{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;margin:0;color:var(--accent);letter-spacing:.01em}
.when{font-size:.75rem;color:var(--ink-soft)}
.when a{color:var(--accent);font-weight:700;text-decoration:none}
.stat{text-align:right}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--ink-soft)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.view[hidden]{display:none}
.prompt{font-family:var(--display);font-weight:500;font-size:1rem;color:var(--ink-soft);text-align:center;margin:0;min-height:1.3em}
.prompt b{color:var(--accent);font-weight:600}

/* ---------- the mountain ---------- */
.map{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 0 var(--line);
  /* the mountain is always a bright spring day, whatever the phone's theme */
  --tile:#ffffff; --ink:#1f3326; --ink-soft:#5b6f60; --accent:#2f8a4a; --on-accent:#ffffff; --hit:#3c9a50; --fail:#c66f79; --on-mark:#ffffff;
  --sky1:#7cc4f0; --sky2:#e6f6fd; --far:#a9bed3; --snow:#ffffff; --rock:#a7b2a0;
  --slope1:#8cc46c; --slope2:#5f9f4a; --meadow1:#a3d473; --meadow2:#c3e48d; --pine:#2f6b3f; --sun:#fff1b0;
  --cloud:rgba(255,255,255,.96); --cloud-hi:#ffffff; --trail:#fbf4e2; color:var(--ink)}
.scene{filter:saturate(calc(.92 + var(--p,0)*.2)) brightness(calc(.97 + var(--p,0)*.07));transition:filter 1.6s}
/* sunlight grows as you climb: the sun sits above the clouds and swells and warms with each stop */
.sunwrap{position:absolute;right:calc(10% - var(--p,0)*2%);top:calc(7% - var(--p,0)*2%);z-index:3;pointer-events:none;transform:translate(50%,-50%) scale(calc(.75 + var(--p,0)*.55));transition:transform 1.6s,right 1.6s,top 1.6s}
.sunwrap .rays{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;opacity:calc(.35 + var(--p,0)*.5);
  background:repeating-conic-gradient(from 0deg,rgba(255,236,160,.55) 0 8deg,transparent 8deg 22deg);-webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent);mask-image:radial-gradient(closest-side,#000 25%,transparent);animation:spin 80s linear infinite}
.sunwrap .disc{position:relative;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fffbe6,#ffe27a 70%);box-shadow:0 0 0 10px rgba(255,232,140,.35),0 0 50px 22px rgba(255,226,120,.55)}
@keyframes spin{to{transform:rotate(360deg)}}
.warmth{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(120% 80% at 92% 0%,rgba(255,236,170,calc(.12 + var(--p,0)*.3)),transparent 60%);transition:background 1.6s}
.scene{position:absolute;inset:0;width:100%;height:100%}
.scene .s1{stop-color:var(--sky1)} .scene .s2{stop-color:var(--sky2)}
.scene .r0{stop-color:var(--rock)} .scene .g1{stop-color:var(--slope1)} .scene .g2{stop-color:var(--slope2)}
.far{fill:var(--far)} .snow{fill:var(--snow)} .m1{fill:var(--meadow1)} .m2{fill:var(--meadow2)} .pine{fill:var(--pine)}
.puff{position:absolute;height:22px;border-radius:999px;background:var(--cloud-hi);opacity:.85;animation:float 40s linear infinite}
.puff::before,.puff::after{content:"";position:absolute;bottom:6px;border-radius:50%;background:inherit}
.puff::before{left:18%;width:44%;height:200%}
.puff::after{left:48%;width:34%;height:150%}
@keyframes float{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}
.flower{position:absolute;width:6px;height:6px;border-radius:50%;transform:translate(-50%,-50%)}
.flower.big{width:8px;height:8px;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.edge{stroke:var(--trail);stroke-width:3;stroke-dasharray:1 7;stroke-linecap:round;fill:none;vector-effect:non-scaling-stroke;opacity:.9}
.edge.open{stroke-width:4}
.edge.walked{stroke:var(--trail);stroke-width:6;stroke-dasharray:none;opacity:1}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(86px,27vw,120px);min-height:52px;padding:6px 6px 7px;border-radius:16px;border:0;background:var(--tile);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;z-index:1;box-shadow:0 3px 10px rgba(20,50,30,.18);transition:transform .2s}
.node .cat{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.1}
.node .sub{font-size:.7rem;color:var(--ink-soft)}
.node.locked{opacity:.6}
.node.avail{cursor:pointer;box-shadow:0 0 0 3px var(--accent),0 3px 10px rgba(20,50,30,.2);animation:breathe 2.6s ease-in-out infinite}
.node.avail .sub{color:var(--accent);font-weight:700}
.node.avail:active{transform:translate(-50%,-50%) scale(.95)}
.node.going{background:var(--accent);color:var(--on-accent);cursor:pointer}
.node.going .sub{color:var(--on-accent)}
.node.solved{background:var(--hit);color:var(--on-mark)}
.node.failed{background:var(--fail);color:var(--on-mark)}
.node.solved .sub,.node.failed .sub{color:var(--on-mark);opacity:.9}
.node.solved .cat,.node.failed .cat{letter-spacing:.1em}
.node.camp{width:auto;min-height:0;flex-direction:row;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:.85rem}
.node.camp svg{width:22px;height:22px}
.node.summit .sub::before{content:"▲ ";color:var(--snow);text-shadow:0 0 1px var(--ink-soft)}
@keyframes breathe{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 30%,transparent),0 3px 10px rgba(20,50,30,.2)}}
.clouds{position:absolute;left:-10%;right:-10%;top:0;z-index:2;pointer-events:none;overflow:hidden;background:linear-gradient(to bottom,#ffffff,var(--cloud) 70%);transition:height 1.6s cubic-bezier(.3,.7,.2,1);
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 60px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 60px),transparent)}
.billow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,#ffffff 55%,rgba(255,255,255,0));animation:billow ease-in-out infinite alternate}
@keyframes billow{from{transform:translateX(-10%) scale(1)}to{transform:translateX(10%) scale(1.08)}}
.cloudnote{position:absolute;left:0;right:0;bottom:62px;text-align:center;font-family:var(--display);font-weight:500;color:var(--ink-soft);font-size:.85rem;opacity:.8}
.endcard{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;background:var(--tile);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.endcard h2{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;line-height:1.1;color:var(--accent)}
.endcard p{margin:0;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--display);font-weight:600;font-size:.95rem;padding:11px 16px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent)}
pre.share{font-size:.8rem;line-height:1.3;white-space:pre-wrap;margin:0;user-select:all}

/* ---------- word screen ---------- */
.wordtop{display:flex;align-items:center;gap:10px;flex:none}
.back{border:0;background:var(--tile);color:var(--ink);border-radius:12px;height:40px;padding:0 14px;font-family:var(--display);font-weight:600;font-size:.9rem;cursor:pointer;box-shadow:0 1px 0 var(--line),0 2px 6px rgba(0,0,0,.06)}
.wordtop .title{flex:1;min-width:0}
.wordtop .title b{display:block;font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.05}
.wordtop .title span{font-size:.78rem;color:var(--ink-soft)}
.gridwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-rows:repeat(6,var(--ts,56px));gap:6px}
.row{display:grid;grid-template-columns:repeat(5,var(--ts,56px));gap:6px}
.t{display:grid;place-items:center;border:2px solid var(--line);border-radius:10px;background:var(--tile);font-family:var(--display);font-weight:600;font-size:calc(var(--ts,56px)*.5);text-transform:uppercase;color:var(--ink)}
.t.filled{border-color:var(--ink-soft);animation:pop .12s}
.t.hit{background:var(--hit);border-color:var(--hit);color:var(--on-mark)}
.t.near{background:var(--near);border-color:var(--near);color:var(--on-mark)}
.t.miss{background:var(--miss);border-color:var(--miss);color:var(--on-mark)}
.t.flip{animation:flip .5s ease both;animation-delay:calc(var(--i)*110ms)}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
@keyframes pop{50%{transform:scale(1.08)}}
.row.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* keyboard: an edge-to-edge tray like the phone's own keyboard. Taps snap to the nearest key, so gaps never swallow a press. */
.tray{flex:none;margin-inline:-12px;background:var(--tray);padding:10px 3px calc(14px + env(safe-area-inset-bottom,0px));touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.kb{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:11px}
.kr{display:flex;gap:6px;justify-content:center;padding-inline:3px}
.kr.mid{padding-inline:calc(5% + 3px)}
.k{flex:1 1 0;min-width:0;height:var(--kh,54px);padding:0;border:0;border-radius:8px;background:var(--key);color:var(--key-ink);font:500 1.5rem var(--display);box-shadow:0 1.5px 0 var(--key-edge);cursor:pointer;-webkit-tap-highlight-color:transparent;pointer-events:none}
.k.wide{flex:1.5 1 0;font-size:.95rem;font-weight:600}
.k.enter{background:var(--accent);color:var(--on-accent);box-shadow:0 1.5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.k.del svg{width:26px;height:26px}
.k.hit{background:var(--hit);color:var(--on-mark);box-shadow:none}
.k.near{background:var(--near);color:var(--on-mark);box-shadow:none}
.k.miss{background:transparent;color:var(--ink-soft);box-shadow:inset 0 0 0 1.5px var(--key-edge);opacity:.55}
.k.down{filter:brightness(.88);transform:translateY(1px);box-shadow:none}
.bubble{position:fixed;z-index:30;pointer-events:none;display:grid;place-items:center;font:600 2.3rem var(--display);background:var(--key);color:var(--key-ink);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.bubble[hidden]{display:none}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:600;font-size:1rem;padding:9px 18px;border-radius:999px;z-index:20;max-width:calc(100vw - 32px);text-align:center}
.toast[hidden]{display:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.rays,.puff,.billow,.node.avail,.t.flip,.t.filled,.row.shake{animation:none}.clouds{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div><h1>Trailhead</h1><div class="when"><span id="when">Daily climb</span> · <a href="/">All games</a></div></div>
    <div class="stat"><b id="total">0</b><span>guesses</span></div>
  </header>

  <section class="view" id="mapView" aria-label="Mountain">
    <p class="prompt" id="prompt"></p>
    <div class="map" id="map">
      <svg class="scene" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop class="s1" offset="0"/><stop class="s2" offset=".5"/></linearGradient>
          <linearGradient id="slope" x1="0" y1="0" x2="0" y2="1"><stop class="r0" offset=".04"/><stop class="g1" offset=".22"/><stop class="g2" offset=".75"/></linearGradient>
        </defs>
        <rect width="100" height="100" fill="url(#sky)"/>
        <path class="far" d="M-2 44 L9 27 L15 33 L25 18 L33 29 L40 25 L44 40 V100 H-2Z"/>
        <path class="snow" d="M25 18 L22 22.5 L24 22 L25.5 23.5 L27 21.5 L28.5 22.5Z M9 27 L7 30 L9 29.5 L10.5 30.5 L11.5 29Z"/>
        <path class="far" d="M56 40 L62 26 L68 30 L77 16 L85 27 L92 22 L102 36 V100 H56Z"/>
        <path class="snow" d="M77 16 L74 20.5 L76 20 L77.5 21.5 L79 19.8 L80.5 20.8Z M92 22 L90.2 25 L92 24.5 L93.5 25.5 L94.2 24.2Z"/>
        <path fill="url(#slope)" d="M-6 100 L-6 64 C8 56 22 40 34 26 L50 5 L66 26 C78 40 92 56 106 64 L106 100Z"/>
        <path class="snow" d="M50 5 L42.5 15 L45.5 14 L47.5 16.5 L50 13.5 L52.5 16.5 L54.5 14 L57.5 15Z"/>
        <path class="m1" d="M-6 100 L-6 76 C14 68 34 74 52 70 C72 66 90 72 106 67 L106 100Z"/>
        <path class="m2" d="M-6 100 L-6 88 C22 81 50 90 76 84 C88 81 98 83 106 82 L106 100Z"/>
        <g class="pine">
          <path d="M12 58 l-2 6 h4z M15.5 60 l-1.8 5.4 h3.6z M9 63 l-1.6 5 h3.2z M86 56 l-2 6 h4z M89.5 59 l-1.8 5.4 h3.6z M83 61 l-1.6 5 h3.2z M24 47 l-1.6 4.8 h3.2z M27 49 l-1.4 4.2 h2.8z M74 46 l-1.6 4.8 h3.2z M71 48 l-1.4 4.2 h2.8z M5 73 l-1.8 5.6 h3.6z M95 70 l-1.8 5.6 h3.6z"/>
        </g>
      </svg>
      <div id="sky" aria-hidden="true"></div>
      <div id="flowers" aria-hidden="true"></div>
      <svg class="edges" id="edges" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="nodes"></div>
      <div class="clouds" id="clouds" aria-hidden="true"><div class="cloudnote">Above the clouds</div></div>
      <div class="warmth" aria-hidden="true"></div>
      <div class="sunwrap" aria-hidden="true"><div class="rays"></div><div class="disc"></div></div>
      <div class="endcard" id="endcard" hidden></div>
    </div>
  </section>

  <section class="view" id="wordView" aria-label="Word" hidden>
    <div class="wordtop">
      <button class="back" id="backBtn" type="button">‹ Map</button>
      <div class="title"><b id="wCat">Animals</b><span id="wStep">Stop 1 of 5</span></div>
    </div>
    <div class="gridwrap" id="gridwrap"><div class="grid" id="grid"></div></div>
    <div class="tray" id="tray"><div class="kb" id="kb"></div></div>
  </section>
</div>
<div class="bubble" id="bubble" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/lb.js"></script>
<script>
(function(){
const CATS={
  Animals:['TIGER','HORSE','ZEBRA','SHEEP','OTTER','CAMEL','EAGLE','MOUSE','SNAKE','SHARK','LLAMA','BISON'],
  Food:['PIZZA','BREAD','APPLE','MANGO','PASTA','BACON','LEMON','GRAPE','CANDY','SALAD','TOAST','HONEY'],
  Weather:['STORM','CLOUD','RAINY','SUNNY','FROST','SLEET','WINDY','FOGGY','HUMID','CHILL','FLOOD','MISTY'],
  Music:['PIANO','DRUMS','BANJO','CHORD','TEMPO','VOCAL','BLUES','OPERA','CELLO','FLUTE','LYRIC','TUNES'],
  Games:['RUGBY','TRACK','SKATE','SERVE','PITCH','COURT','MATCH','SCORE','CHESS','POKER','DARTS','BOXER'],
  Home:['CHAIR','TABLE','COUCH','SHELF','CLOCK','STOVE','TOWEL','PLATE','GLASS','BROOM','QUILT','SPOON'],
  Nature:['RIVER','OCEAN','BEACH','CLIFF','MAPLE','CREEK','GRASS','STONE','PLANT','CORAL','FIELD','TRAIL'],
  Body:['HEART','BRAIN','TOOTH','ELBOW','ANKLE','THUMB','CHEST','SPINE','NERVE','LIVER','SKULL','KNEES']

const ROWS=[3,3,3,2,1], STOPS=ROWS.length, TRIES=6;
const XS={1:[.5],2:[.32,.68],3:[.2,.5,.8]};
const rowY=r=>90-r*(78/STOPS); // r=0 chalet ... r=5 summit, % from top
const $=id=>document.getElementById(id);

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function genMap(seed){
  const R=rng(hash(seed)), shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const used=new Set(), nodes={};
  ROWS.forEach((n,ri)=>{const r=ri+1, cats=shuffle(Object.keys(CATS)).slice(0,n);
    cats.forEach((cat,j)=>{const word=shuffle(CATS[cat]).find(w=>!used.has(w));used.add(word);
      nodes[r+'-'+j]={id:r+'-'+j,r,j,x:XS[n][j],cat,word,next:[]}})});
  Object.values(nodes).forEach(a=>{Object.values(nodes).forEach(b=>{if(b.r===a.r+1&&Math.abs(b.x-a.x)<=.36)a.next.push(b.id)})});
  nodes.camp={id:'camp',r:0,x:.5,next:Object.values(nodes).filter(n=>n.r===1).map(n=>n.id)};
  return nodes;
}

let S, M, draft='', busy=false;
const KEY='fogline-climb';
function fresh(seed,daily){return {seed,daily,path:[],cur:null,g:{},res:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}

const here=()=>S.path.length?S.path[S.path.length-1]:'camp';
const avail=()=>S.path.length>=STOPS?[]:M[here()].next;
const finished=()=>S.path.length>=STOPS;
const cost=id=>S.res[id]==='failed'?TRIES+1:(S.g[id]||[]).length;
const total=()=>Object.keys(S.g).reduce((a,id)=>a+cost(id),0);

function score(g,a){const r=Array(5).fill('miss'),pool={};for(let i=0;i<5;i++){if(g[i]===a[i])r[i]='hit';else pool[a[i]]=(pool[a[i]]||0)+1}for(let i=0;i<5;i++){if(r[i]!=='hit'&&pool[g[i]]){r[i]='near';pool[g[i]]--}}return r}
function toast(msg,ms){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,ms||1600)}

// ---------- scenery ----------
function buildScenery(){
  const fl=$('flowers'), R=rng(42), cols=['#8f74de','#f2c84b','#ffffff','#f29bb8','#6f9ff0'];
  for(let i=0;i<46;i++){const d=document.createElement('div');const big=R()<.25;d.className='flower'+(big?' big':'');
    const y=58+R()*40, x=R()*100; d.style.left=x+'%'; d.style.top=y+'%'; d.style.background=cols[Math.floor(R()*cols.length)]; fl.appendChild(d)}
  const sky=$('sky');
  [[12,40,70],[30,58,95]].forEach(([top,w,dur],i)=>{const p=document.createElement('div');p.className='puff';p.style.top=top+'%';p.style.width=w+'px';p.style.animationDuration=dur+'s';p.style.animationDelay=(-i*35)+'s';sky.appendChild(p)});
  const cl=$('clouds');
  for(let i=0;i<10;i++){const b=document.createElement('div');b.className='billow';const s=120+((i*47)%110);
    b.style.width=s*1.9+'px';b.style.height=s+'px';b.style.left=((i*31)%95-12)+'%';b.style.top=((i*23)%90-8)+'%';
    b.style.animationDuration=(10+(i*5)%9)+'s';b.style.animationDelay=(-i*1.3)+'s';cl.insertBefore(b,cl.firstChild)}
}
const CHALET='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12 12 4l10 8" fill="none" stroke="#7a4a2a" stroke-width="2.4" stroke-linejoin="round"/><path d="M5 11h14v9H5z" fill="#c98b55"/><path d="M10 20v-5h4v5z" fill="#7a4a2a"/><path d="M6.5 13h3v2.5h-3zM14.5 13h3v2.5h-3z" fill="#fff6dc"/></svg>';

// ---------- map ----------
function renderMap(){
  const A=new Set(avail()), chain=['camp',...S.path];
  const frontier=finished()?STOPS:S.path.length+1;
  let svg='';
  Object.values(M).forEach(a=>a.next.forEach(bid=>{const b=M[bid];
    const i=chain.indexOf(a.id), walked=i>=0&&chain[i+1]===bid, open=a.id===here()&&A.has(bid)&&!S.cur;
    const mx=(a.x+b.x)*50+(a.x===b.x?3:0), my=(rowY(a.r)+rowY(b.r))/2;
    svg+='<path class="edge'+(walked?' walked':open?' open':'')+'" d="M'+a.x*100+' '+rowY(a.r)+' Q'+mx+' '+my+' '+b.x*100+' '+rowY(b.r)+'"/>'}));
  $('edges').innerHTML=svg;
  const box=$('nodes');box.innerHTML='';
  Object.values(M).forEach(n=>{
    const b=document.createElement('button');b.type='button';
    b.style.left=n.x*100+'%';b.style.top=rowY(n.r)+'%';
    if(n.id==='camp'){b.className='node camp';b.innerHTML=CHALET+'<span>Chalet</span>';b.tabIndex=-1;box.appendChild(b);return}
    const st=S.res[n.id], isCur=S.cur===n.id, isAvail=!S.cur&&A.has(n.id), hidden=n.r>frontier;
    b.className='node'+(n.r===STOPS?' summit':'')+(st?' '+st:isCur?' going':isAvail?' avail':' locked');
    if(st)b.innerHTML='<span class="cat">'+n.word+'</span><span class="sub">'+(st==='solved'?cost(n.id)+' of '+TRIES:'missed')+'</span>';
    else if(hidden)b.innerHTML='<span class="cat">?</span><span class="sub">'+(n.r===STOPS?'Summit':'')+'</span>';
    else b.innerHTML='<span class="cat">'+n.cat+'</span><span class="sub">'+(isCur?'Continue':isAvail?'Climb here':n.r===STOPS?'Summit':'Stop '+n.r)+'</span>';
    b.setAttribute('aria-label',hidden?'Stop hidden in the clouds':(st?n.word+', '+st:n.cat+(isAvail?', available':isCur?', in progress':'')));
    if(isAvail||isCur)b.onclick=()=>enter(n.id);else{b.tabIndex=-1;b.setAttribute('aria-disabled','true')}
    box.appendChild(b);
  });
  const edge=frontier>=STOPS?0:(rowY(frontier)+rowY(frontier+1))/2+5;
  $('clouds').style.height=edge+'%';
  $('map').style.setProperty('--p',(S.path.length/STOPS).toFixed(2));
  const pr=$('prompt');
  if(finished())pr.innerHTML='You made it to the top';
  else if(S.cur)pr.innerHTML='Finish <b>'+M[S.cur].cat+'</b> to keep climbing';
  else if(!S.path.length)pr.innerHTML='Choose a trail. Each stop hides a <b>5-letter word</b>';
  else pr.innerHTML='Stop '+(S.path.length+1)+' of '+STOPS+' · <b>pick your next stop</b>';
  $('total').textContent=total();
  renderEnd();
}
function renderEnd(){
  const ec=$('endcard');
  if(!finished()){ec.hidden=true;ec.innerHTML='';return}
  const solved=S.path.filter(id=>S.res[id]==='solved').length, sum=S.res[S.path[STOPS-1]]==='solved';
  ec.hidden=false;
  ec.innerHTML='<h2>'+(sum?'Summit reached':'You finished the climb')+'</h2><p>'+solved+' of '+STOPS+' words · '+total()+' guesses'+(S.daily?' · a new mountain tomorrow':'')+'</p><div class="actions"><button class="btn primary" id="shareBtn" type="button">Copy results</button>'+(S.daily&&window.SLB?'<button class="btn" id="lbBtn" type="button">🏆 Leaderboard</button>':'')+'<button class="btn" id="againBtn" type="button">Climb again</button></div><pre class="share" id="shareTxt" hidden></pre>';
  $('shareBtn').onclick=copy; $('againBtn').onclick=()=>newRun(false);
  if(S.daily&&window.SLB){
    const day=SLB.dayNo(); SLB.stop('trailhead',day);
    const cs=getComputedStyle(document.body);
    const openLb=()=>SLB.open({game:'trailhead',day,score:total(),eligible:true,fmt:n=>n+' guesses',note:'Fewest guesses to the summit wins. Ties go to the fastest.',accent:'var(--accent)',accentInk:'var(--on-accent)',panelBg:cs.getPropertyValue('--tile')||'#fff',panelInk:cs.getPropertyValue('--ink')||'#1f3326'});
    $('lbBtn').onclick=openLb;
    const seenKey='slb-seen:trailhead:'+day;
    if(!SLB.wasPosted('trailhead',day)&&!localStorage.getItem(seenKey)){try{localStorage.setItem(seenKey,'1')}catch(e){} setTimeout(openLb,900);}
  }
}
function shareText(){
  const lines=S.path.map(id=>{const c=S.res[id]==='failed'?TRIES:S.g[id].length;return (S.res[id]==='failed'?'🌧 ':'🌼 ')+M[id].cat+' '+'●'.repeat(c)+'○'.repeat(TRIES-c)});
  return 'Trailhead '+(S.daily?S.seed:'practice')+' ⛰\n'+total()+' guesses to the summit\n'+lines.join('\n');
}
function copy(){
  const txt=shareText(), pre=$('shareTxt');
  const fallback=()=>{pre.textContent=txt;pre.hidden=false;toast('Select the text to copy')};
  try{navigator.clipboard.writeText(txt).then(()=>toast('Results copied'),fallback)}catch(e){fallback()}
}

// ---------- word screen ----------
function enter(id){
  if(!S.cur)S.cur=id; S.g[id]=S.g[id]||[]; draft=''; save();
  $('mapView').hidden=true;$('wordView').hidden=false;
  renderWord(); sizeAll();
}
function toMap(){$('wordView').hidden=true;$('mapView').hidden=false;renderMap()}
$('backBtn').onclick=toMap;

function renderWord(flipRow){
  const n=M[S.cur], gs=S.g[S.cur];
  $('wCat').textContent=n.cat; $('wStep').textContent=(n.r===STOPS?'The summit':'Stop '+n.r+' of '+STOPS)+' · '+(TRIES-gs.length)+' tries left';
  const grid=$('grid');grid.innerHTML='';
  for(let r=0;r<TRIES;r++){
    const row=document.createElement('div');row.className='row'+(r===gs.length?' cur':'');
    for(let c=0;c<5;c++){const t=document.createElement('div');t.className='t';
      if(r<gs.length){t.textContent=gs[r].g[c];t.className+=' '+gs[r].res[c];if(r===flipRow){t.className+=' flip';t.style.setProperty('--i',c)}}
      else if(r===gs.length&&draft[c]){t.textContent=draft[c];t.className+=' filled'}
      row.appendChild(t)}
    grid.appendChild(row)}
  const ks={},rank={miss:1,near:2,hit:3};
  gs.forEach(q=>q.g.split('').forEach((c,j)=>{const r=q.res[j];if(!ks[c]||rank[r]>rank[ks[c]])ks[c]=r}));
  keys.forEach(k=>{if(k.dataset.k.length===1){k.classList.remove('hit','near','miss');if(ks[k.dataset.k])k.classList.add(ks[k.dataset.k])}});
}
function type(L){if(!S.cur||busy||draft.length>=5)return;if(S.daily&&window.SLB)SLB.start('trailhead',SLB.dayNo());draft+=L;renderWord()}
function back(){if(!S.cur||busy||!draft.length)return;draft=draft.slice(0,-1);renderWord()}
function shake(){const r=document.querySelector('.row.cur');if(r){r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake')}}
function submit(){
  if(!S.cur||busy)return;
  if(draft.length<5){toast('Five letters, please');shake();return}
  const id=S.cur,n=M[id],gs=S.g[id];
  if(!VALID.has(draft.toLowerCase())){toast('Not in the word list');shake();return}
  if(gs.some(q=>q.g===draft)){toast('Already tried that one');shake();return}
  gs.push({g:draft,res:score(draft,n.word)});
  const win=draft===n.word, out=gs.length>=TRIES; draft='';
  renderWord(gs.length-1); save(); $('total').textContent=total();
  if(win||out){
    busy=true; S.res[id]=win?'solved':'failed'; S.path.push(id); S.cur=null; save();
    setTimeout(()=>toast(win?['Wow, first try','Brilliant','Lovely','Nicely done','Steady climb','Just made it'][gs.length-1]:'It was '+n.word,1300),650);
    setTimeout(()=>{busy=false;toMap()},2100);
  }
}

// ---------- keyboard ----------
const keys=[];
const DEL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 20 19H9l-6.5-7z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M11.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
function buildKb(){
  const kb=$('kb');
  [['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['ENTER','Z','X','C','V','B','N','M','DEL']].forEach((r,ri)=>{
    const d=document.createElement('div');d.className='kr'+(ri===1?' mid':'');
    r.forEach(k=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.className='k';b.tabIndex=-1;
      if(k==='ENTER'){b.className+=' wide enter';b.textContent='Enter'}
      else if(k==='DEL'){b.className+=' wide del';b.innerHTML=DEL;b.setAttribute('aria-label','Delete')}
      else b.textContent=k;
      d.appendChild(b);keys.push(b)});
    kb.appendChild(d)});
  const tray=$('tray'), bubble=$('bubble');
  let held=null, rep=0, rept=0;
  function nearest(x,y){let best=null,bd=1e9;for(const k of keys){const r=k.getBoundingClientRect();
    const dx=Math.max(r.left-x,0,x-r.right), dy=Math.max(r.top-y,0,y-r.bottom), d=dx*dx+dy*dy*1.6;if(d<bd){bd=d;best=k}}return bd<40*40?best:null}
  function act(k){const v=k.dataset.k;if(v==='ENTER')submit();else if(v==='DEL')back();else type(v)}
  function release(){if(held){held.classList.remove('down');held=null}bubble.hidden=true;clearTimeout(rept);clearInterval(rep)}
  tray.addEventListener('pointerdown',e=>{
    const k=nearest(e.clientX,e.clientY); if(!k)return; e.preventDefault(); release();
    held=k;k.classList.add('down');act(k);
    if(k.dataset.k.length===1&&e.pointerType!=='mouse'){const r=k.getBoundingClientRect(),w=Math.max(r.width*1.6,54);
      bubble.textContent=k.dataset.k;bubble.style.width=w+'px';bubble.style.height=r.height*1.15+'px';
      bubble.style.left=(r.left+r.width/2-w/2)+'px';bubble.style.top=(r.top-r.height*1.25)+'px';bubble.hidden=false}
    if(k.dataset.k==='DEL')rept=setTimeout(()=>{rep=setInterval(back,85)},400);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>tray.addEventListener(ev,release));
  tray.addEventListener('contextmenu',e=>e.preventDefault());
}
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||$('wordView').hidden)return;
  if(e.key==='Enter'){submit();e.preventDefault()}
  else if(e.key==='Backspace'){back();e.preventDefault()}
  else if(e.key==='Escape')toMap();
  else if(/^[a-z]$/i.test(e.key))type(e.key.toUpperCase());
});

// key height follows key width (like a phone keyboard); tiles fill whatever height is left
function sizeAll(){
  const kw=Math.min(window.innerWidth,520)/10;
  const kh=Math.round(Math.max(46,Math.min(58,kw*1.45,window.innerHeight*.075)));
  document.documentElement.style.setProperty('--kh',kh+'px');
  const w=$('gridwrap'),W=w.clientWidth,H=w.clientHeight;if(!W||!H)return;
  const ts=Math.floor(Math.max(30,Math.min(64,(W-24)/5,(H-30)/6)));
  document.documentElement.style.setProperty('--ts',ts+'px');
}

function newRun(daily){
  const seed=daily?today():'p'+Date.now().toString(36);
  S=fresh(seed,daily); M=genMap(seed); draft=''; save();
  $('when').textContent=daily?'Daily climb':'Practice climb';
  $('wordView').hidden=true;$('mapView').hidden=false;
  $('clouds').style.transition='none';renderMap();void $('clouds').offsetHeight;$('clouds').style.transition='';
}

function start(data){
  buildKb(); buildScenery();
  const saved=(data&&data.S)||load();
  S=(saved&&saved.seed&&(!saved.daily||saved.seed===today()))?saved:fresh(today(),true);
  M=genMap(S.seed);
  $('when').textContent=S.daily?'Daily climb':'Practice climb';
  $('clouds').style.transition='none';renderMap();void $('clouds').offsetHeight;$('clouds').style.transition='';
  if(S.cur)enter(S.cur);
  sizeAll(); new ResizeObserver(sizeAll).observe($('gridwrap')); window.addEventListener('resize',sizeAll);
  window.claude?.hot?.snapshot?.(()=>({S}));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
